<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Jogo do Castelo 3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--ink:#fff3d4;--btn:#ffcf4d;--btn-ink:#3a2412}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0;overflow:hidden;background:#100a08;font-family:"Trebuchet MS",system-ui,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:14px;display:flex;justify-content:space-between;color:#fff;font-weight:800;font-size:clamp(16px,3vw,24px);text-shadow:0 2px 4px rgba(0,0,0,.6);pointer-events:none;z-index:5}
#msg{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);color:#fff;font-weight:800;font-size:clamp(20px,5vw,40px);text-align:center;text-shadow:0 3px 8px rgba(0,0,0,.7);z-index:10}
#msg.off{display:none}
#msg span{display:block;font-size:.5em;font-weight:700;margin-top:10px}
#touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:6}
body.touch #touch{display:block}
.pad{position:absolute;left:14px;bottom:14px;display:grid;grid-template-columns:70px 70px;grid-template-rows:70px;gap:8px}
.pad button,#jbtn{pointer-events:auto;border:3px solid rgba(255,255,255,.7);background:rgba(120,30,30,.55);color:#fff3d4;font-weight:800;font-size:28px;border-radius:18px;touch-action:none}
.pad button:active,#jbtn:active{background:rgba(160,40,40,.9)}
#jbtn{position:fixed;right:18px;bottom:24px;width:100px;height:100px;border-radius:50%;font-size:18px;pointer-events:auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="lv">Fase 1 · Castelo 3D</div>
  <div id="lives">❤️❤️❤️</div>
</div>
<div id="msg" class="off"><div id="msgTxt"></div><span id="msgSub"></span></div>
<div id="touch">
  <div class="pad">
    <button id="bl">←</button>
    <button id="br">→</button>
  </div>
  <button id="jbtn">PULAR</button>
</div>

<script>
(function(){
'use strict';
const cv=document.getElementById('c');
const $=id=>document.getElementById(id);
let W=innerWidth,H=innerHeight;
if(matchMedia('(pointer:coarse)').matches)document.body.classList.add('touch');

/* ===== mundo da fase 1 (física em "pixels", igual antes) ===== */
const GRAV=1500,JUMP=-620,SPEED=270,GROUND_Y=620;
const LEVEL_END=3300;
const platforms=[
  {x:0,y:GROUND_Y,w:LEVEL_END+400,h:200},
  {x:900,y:GROUND_Y-90,w:170,h:26},
  {x:1550,y:GROUND_Y-90,w:170,h:26},
  {x:2250,y:GROUND_Y-90,w:170,h:26},
];
const banners=[260,760,1260,1760,2260,2760,3160].map(x=>({x}));
const portraits=[500,1020,1520,2020,2520,3020].map(x=>({x}));
const tableSets=[150,1150,1900,2650].map(x=>({x}));
const bloodSpots=[380,700,1080,1480,1900,2220,2600,2980,180,560,940,1300,1680,2060,2440,2820,3100].map(x=>({x,r:18+((x*7)%26)}));
const fallenBodies=[320,860,1340,1760,2140,2520,2960].map((x,i)=>({x,flip:i%2===0}));
const debris=[240,600,960,1230,1620,2000,2380,2760,3060].map((x,i)=>({x,kind:i%3}));
const vases=[420,780,1080,1400,1760,2080,2400,2760,3080].map((x,i)=>({x,side:i%2===0?1:-1}));
const windowXs=[220,720,1220,1720,2220,2720,3220];
const zombiesData=[
  {x:480,pMin:420,pMax:640},
  {x:1000,pMin:920,pMax:1160},
  {x:1420,pMin:1360,pMax:1560},
  {x:1900,pMin:1820,pMax:2050},
  {x:2400,pMin:2320,pMax:2560},
  {x:2820,pMin:2750,pMax:3000},
];
let zombies=[];
function resetZombies(){
  zombies=zombiesData.map((z,i)=>({x:z.x,y:GROUND_Y,w:34,h:52,pMin:z.pMin,pMax:z.pMax,spd:.7+Math.random()*.6,dir:Math.random()<.5?1:-1,alive:true,hitT:0,mesh:zombieMeshes[i]}));
}
const goal={x:LEVEL_END,y:GROUND_Y-150,w:70,h:150};

/* ===== estado do jogo ===== */
let state='title',lives=3,camX=0,t=0,keys={},touchL=0,touchR=0,jumpBuf=0;
let P={x:60,y:GROUND_Y-70,vx:0,vy:0,w:32,h:50,onGround:false,coy:0,inv:0,dir:1};
function resetPlayer(){P.x=60;P.y=GROUND_Y-70;P.vx=0;P.vy=0;P.onGround=false;P.coy=0;P.inv=1;camX=0}
function setLives(){$('lives').textContent='❤️'.repeat(Math.max(0,lives))+'🖤'.repeat(Math.max(0,3-lives))}
function showMsg(txt,sub){$('msgTxt').textContent=txt;$('msgSub').textContent=sub||'';$('msg').classList.remove('off')}
function hideMsg(){$('msg').classList.add('off')}
function start(){lives=3;setLives();resetPlayer();resetZombies();state='playing';hideMsg()}
addEventListener('keydown',e=>{
  if((state==='title'||state==='over'||state==='win')&&(e.code==='Space'||e.code==='Enter')){start();return}
  keys[e.code]=true;
  if(!e.repeat&&(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'))jumpBuf=.12;
});
addEventListener('keyup',e=>{keys[e.code]=false});
cv.addEventListener('pointerdown',()=>{if(state==='title'||state==='over'||state==='win')start()});
$('bl').addEventListener('pointerdown',e=>{e.preventDefault();touchL=1});
$('br').addEventListener('pointerdown',e=>{e.preventDefault();touchR=1});
['pointerup','pointercancel','pointerleave'].forEach(ev=>{
  $('bl').addEventListener(ev,()=>touchL=0);
  $('br').addEventListener(ev,()=>touchR=0);
});
$('jbtn').addEventListener('pointerdown',e=>{e.preventDefault();jumpBuf=.12});

function rectsOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function update(dt){
  t+=dt;
  if(state!=='playing')return;
  if(jumpBuf>0)jumpBuf-=dt;
  if(P.inv>0)P.inv-=dt;
  const left=keys.ArrowLeft||keys.KeyA||touchL,right=keys.ArrowRight||keys.KeyD||touchR;
  const ax=(right?1:0)-(left?1:0);
  if(ax)P.dir=ax;
  const want=ax*SPEED;
  const acc=P.onGround?2600:1400;
  if(P.vx<want)P.vx=Math.min(want,P.vx+acc*dt);else if(P.vx>want)P.vx=Math.max(want,P.vx-acc*dt);
  P.x+=P.vx*dt;
  P.x=Math.max(P.x,10);
  if(P.onGround)P.coy=.1;else P.coy-=dt;
  if(jumpBuf>0&&P.coy>0){P.vy=JUMP;P.onGround=false;P.coy=0;jumpBuf=0}
  P.vy+=GRAV*dt;
  const oy=P.y;
  P.y+=P.vy*dt;
  P.onGround=false;
  for(const pf of platforms){
    if(P.x+P.w>pf.x&&P.x<pf.x+pf.w){
      if(P.vy>=0&&oy+P.h<=pf.y+10&&P.y+P.h>=pf.y){
        P.y=pf.y-P.h;P.vy=0;P.onGround=true;
      }
    }
  }
  for(const z of zombies){
    if(!z.alive)continue;
    if(z.hitT>0)z.hitT-=dt;
    z.x+=z.dir*40*z.spd*dt;
    if(z.x<=z.pMin){z.x=z.pMin;z.dir=1}else if(z.x>=z.pMax){z.x=z.pMax;z.dir=-1}
    const zb={x:z.x-z.w/2,y:z.y-z.h,w:z.w,h:z.h};
    const pb={x:P.x,y:P.y,w:P.w,h:P.h};
    if(rectsOverlap(pb,zb)){
      if(P.vy>0&&P.y+P.h-8<zb.y+14){
        z.alive=false;P.vy=JUMP*.6;P.inv=.3;
      }else if(P.inv<=0){
        lives--;setLives();P.inv=1.2;P.vy=-380;P.vx=-P.dir*160;
        if(lives<=0){state='over';showMsg('🧟 Você foi pego pelos zumbis','Toque ou aperte ESPAÇO para tentar de novo')}
      }
    }
  }
  if(P.y>H+3000){
    lives--;setLives();
    if(lives<=0){state='over';showMsg('🧟 Você foi pego pelos zumbis','Toque ou aperte ESPAÇO para tentar de novo')}
    else{resetPlayer();P.inv=1.2}
  }
  const pb={x:P.x,y:P.y,w:P.w,h:P.h};
  if(rectsOverlap(pb,goal)){
    state='win';showMsg('👑 Fase 1 completa!','Toque ou aperte ESPAÇO para jogar de novo');
  }
  const targetCam=Math.max(0,Math.min(LEVEL_END-W+90,P.x-W*.4));
  camX+=(targetCam-camX)*Math.min(1,dt*4);
}

/* ===== mundo 3D (Three.js) ===== */
const S=40; // 1 unidade 3D = 40 "pixels" do jogo
const wx=px=>px/S;
const wy=py=>(GROUND_Y-py)/S; // converte altura: GROUND_Y vira chão (y=0)
const X0=-3, XEND=(LEVEL_END+400)/S;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x140d0a);
scene.fog=new THREE.FogExp2(0x140d0a,.018);
const camera=new THREE.PerspectiveCamera(58,W/H,.1,300);
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(W,H);
function resize(){W=innerWidth;H=innerHeight;camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H)}
addEventListener('resize',resize);

scene.add(new THREE.HemisphereLight(0x8899cc,0x1a0f08,.55));
const sun=new THREE.DirectionalLight(0xffe2b0,.35);
sun.position.set(10,20,10);scene.add(sun);

function PM(color,opts){return new THREE.MeshStandardMaterial(Object.assign({color,roughness:.85,metalness:.05},opts||{}))}
function mesh(geo,mat,x,y,z){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);scene.add(m);return m}
function texFromCanvas(draw,w,h){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);return new THREE.CanvasTexture(c)}
function seededRand(n){const s=Math.sin(n*12.9898)*43758.5453;return s-Math.floor(s)}

/* chão de pedra */
const floorTex=texFromCanvas((c,w,h)=>{
  c.fillStyle='#6b6258';c.fillRect(0,0,w,h);
  c.strokeStyle='rgba(20,15,10,.5)';c.lineWidth=3;
  for(let y=0;y<h;y+=32)for(let x=0;x<w;x+=32){
    c.strokeRect(x,y,32,32);
    c.fillStyle=`rgba(0,0,0,${.03+seededRand(x+y)*.06})`;c.fillRect(x,y,32,32);
  }
},256,256);
floorTex.wrapS=floorTex.wrapT=THREE.RepeatWrapping;floorTex.repeat.set((XEND-X0)*.6,3);
const floorW=XEND-X0;
const floorMesh=mesh(new THREE.PlaneGeometry(floorW,7),PM(0xffffff,{map:floorTex,roughness:.95}),X0+floorW/2,0,0);
floorMesh.rotation.x=-Math.PI/2;

/* tapete vermelho no meio do corredor */
const carpet=mesh(new THREE.PlaneGeometry(floorW-1,2.3),PM(0x7a1414,{roughness:.9}),X0+floorW/2,.01,0);
carpet.rotation.x=-Math.PI/2;
[-1.18,1.18].forEach(zz=>{
  const trim=mesh(new THREE.PlaneGeometry(floorW-1,.12),PM(0xdba63d,{roughness:.6,metalness:.3}),X0+floorW/2,.012,zz);
  trim.rotation.x=-Math.PI/2;
});

/* paredes de pedra */
const brickTex=texFromCanvas((c,w,h)=>{
  c.fillStyle='#3a2f26';c.fillRect(0,0,w,h);
  c.strokeStyle='rgba(0,0,0,.5)';c.lineWidth=3;
  const bw=48,bh=28;
  for(let row=0;row*bh<h+bh;row++){
    const off=row%2?bw/2:0;
    for(let x=-bw+off;x<w+bw;x+=bw){
      c.fillStyle='rgba(255,255,255,.04)';c.fillRect(x+2,row*bh+2,bw-4,4);
      c.strokeRect(x,row*bh,bw,bh);
    }
  }
},256,256);
brickTex.wrapS=brickTex.wrapT=THREE.RepeatWrapping;brickTex.repeat.set((XEND-X0)*.5,2.2);
const WALL_Z=3.6;
[-1,1].forEach(side=>{
  const wall=mesh(new THREE.PlaneGeometry(floorW+10,7),PM(0xffffff,{map:brickTex}),X0+floorW/2,3.4,WALL_Z*side);
  wall.rotation.y=side>0?Math.PI:0;
});

/* colunas ao longo do corredor (profundidade real) */
function makeColumn(px,side){
  const x=wx(px),z=WALL_Z*side-side*.3;
  const col=mesh(new THREE.CylinderGeometry(.42,.5,5.6,10),PM(0x4a3a28),x,2.8,z);
  mesh(new THREE.BoxGeometry(1.2,.3,1.2),PM(0x544433),x,5.6,z);
  mesh(new THREE.BoxGeometry(1.2,.3,1.2),PM(0x544433),x,.15,z);
  return col;
}
[[100,-1],[900,1],[1700,-1],[2500,1],[3200,-1]].forEach(p=>makeColumn(p[0],p[1]));

/* janelas com céu estrelado */
function makeWindow(px){
  const x=wx(px),z=WALL_Z-.05;
  mesh(new THREE.BoxGeometry(1.6,3.2,.3),PM(0x3a3026),x,4,z);
  const starTex=texFromCanvas((c,w,h)=>{
    const g=c.createLinearGradient(0,0,0,h);
    g.addColorStop(0,'#0a0f22');g.addColorStop(1,'#1a2438');
    c.fillStyle=g;c.fillRect(0,0,w,h);
    c.fillStyle='#e9e4c8';c.beginPath();c.arc(w*.28,h*.22,w*.12,0,Math.PI*2);c.fill();
    for(let i=0;i<20;i++){
      const rx=seededRand(px*3+i)*w,ry=seededRand(px*7+i+50)*h,rs=seededRand(px*11+i)*2+.8;
      c.globalAlpha=.4+seededRand(px*13+i)*.6;
      c.fillRect(rx,ry,rs,rs);
    }
    c.globalAlpha=1;
  },128,256);
  mesh(new THREE.PlaneGeometry(1.2,2.8),new THREE.MeshBasicMaterial({map:starTex}),x,4,z-.12).rotation.y=Math.PI;
  const moon=new THREE.PointLight(0x9db4e0,.5,7);moon.position.set(x,4,z-1.2);scene.add(moon);
}
windowXs.forEach(makeWindow);

/* bandeiras vermelhas com fênix dourada */
function makeBanner(px){
  const x=wx(px),z=WALL_Z-.1;
  const tex=texFromCanvas((c,w,h)=>{
    c.clearRect(0,0,w,h);
    c.fillStyle='#8a1414';
    c.beginPath();c.moveTo(w*.1,0);c.lineTo(w*.9,0);c.lineTo(w*.9,h*.8);c.lineTo(w*.5,h);c.lineTo(w*.1,h*.8);c.closePath();c.fill();
    c.fillStyle='#e8b93a';c.save();c.translate(w*.5,h*.4);
    c.beginPath();c.ellipse(0,0,w*.08,h*.09,0,0,Math.PI*2);c.fill();
    c.beginPath();c.moveTo(0,-h*.04);c.lineTo(-w*.22,-h*.12);c.lineTo(-w*.18,h*.02);c.lineTo(-w*.02,h*.04);c.closePath();c.fill();
    c.beginPath();c.moveTo(0,-h*.04);c.lineTo(w*.22,-h*.12);c.lineTo(w*.18,h*.02);c.lineTo(w*.02,h*.04);c.closePath();c.fill();
    c.beginPath();c.arc(0,-h*.1,w*.035,0,Math.PI*2);c.fill();
    c.restore();
  },128,192);
  mesh(new THREE.PlaneGeometry(1.4,2.2),new THREE.MeshBasicMaterial({map:tex,transparent:true}),x,4.6,z).rotation.y=Math.PI;
}
banners.forEach(b=>makeBanner(b.x));

/* quadros de reis */
function makePortrait(px){
  const x=wx(px),z=WALL_Z-.1;
  const tex=texFromCanvas((c,w,h)=>{
    c.fillStyle='#8a6a2a';c.fillRect(0,0,w,h);
    c.fillStyle='#2a1810';c.fillRect(w*.08,h*.08,w*.84,h*.84);
    c.fillStyle='#caa24a';c.fillRect(w*.32,h*.18,w*.36,h*.12);
    c.beginPath();c.moveTo(w*.32,h*.18);c.lineTo(w*.32,h*.06);c.lineTo(w*.42,h*.18);c.lineTo(w*.5,h*.04);c.lineTo(w*.58,h*.18);c.lineTo(w*.68,h*.06);c.lineTo(w*.68,h*.18);c.closePath();c.fill();
    c.fillStyle='#d9b98a';c.beginPath();c.ellipse(w*.5,h*.42,w*.16,h*.18,0,0,Math.PI*2);c.fill();
    c.fillStyle='#5a1a1a';c.beginPath();c.moveTo(w*.28,h*.62);c.lineTo(w*.72,h*.62);c.lineTo(w*.64,h*.9);c.lineTo(w*.36,h*.9);c.closePath();c.fill();
  },128,160);
  mesh(new THREE.PlaneGeometry(1.4,1.75),new THREE.MeshBasicMaterial({map:tex}),x,3.9,z).rotation.y=Math.PI;
}
portraits.forEach(p=>makePortrait(p.x));

/* mesas com cadeiras (decoração ao fundo) */
function makeTableSet(px){
  const x=wx(px),z=WALL_Z*(px%2===0?1:-1)-(px%2===0?1:-1)*.9;
  const wood=PM(0x4a3626),top=PM(0x5a4230);
  [[-1.1,-.6],[-1.1,.6],[1.1,-.6],[1.1,.6]].forEach(l=>mesh(new THREE.BoxGeometry(.12,1,.12),wood,x+l[0],.5,z+l[1]));
  mesh(new THREE.BoxGeometry(2.4,.12,1.4),top,x,1.05,z);
  // cadeiras
  [-1.8,1.8].forEach(cx=>{
    mesh(new THREE.BoxGeometry(.7,.6,.7),wood,x+cx,.3,z);
    mesh(new THREE.BoxGeometry(.7,.7,.1),wood,x+cx,.65,z+(cx>0?.3:-.3));
  });
  mesh(new THREE.CylinderGeometry(.18,.22,.3,8),PM(0x8a8a92),x-.4,1.25,z);
  mesh(new THREE.BoxGeometry(.3,.3,.3),PM(0xcaa24a),x+.5,1.25,z);
}
tableSets.forEach(ts=>makeTableSet(ts.x));

/* vasos de flores no caminho */
function makeVase(px,side){
  const x=wx(px),z=1.55*side;
  mesh(new THREE.CylinderGeometry(.16,.22,.5,10),PM(0x9a5a3a),x,.25,z);
  const colors=[0xdd5577,0xffcf4d,0xffffff,0xaa66dd];
  for(let i=0;i<5;i++){
    const ang=i/5*Math.PI*2;
    mesh(new THREE.SphereGeometry(.12,8,8),PM(colors[i%colors.length],{roughness:.6}),x+Math.cos(ang)*.14,.62+seededRand(px+i)*.12,z+Math.sin(ang)*.14);
  }
  mesh(new THREE.CylinderGeometry(.03,.03,.5,6),PM(0x3a5a2a),x,.5,z);
}
vases.forEach(v=>makeVase(v.x,v.side));

/* manchas de sangue no chão */
function makeBlood(px,r){
  const x=wx(px);
  const bm=mesh(new THREE.CircleGeometry(r/S,10),new THREE.MeshBasicMaterial({color:0x5a0a0a,transparent:true,opacity:.55}),x,.015,(seededRand(px)-.5)*1.6);
  bm.rotation.x=-Math.PI/2;
}
bloodSpots.forEach(b=>makeBlood(b.x,b.r));

/* corpos caídos infectados pelo zumbi (decoração, sem detalhe gráfico) */
function makeFallenBody(px,flip){
  const x=wx(px),z=flip?1.7:-1.7;
  const bm=mesh(new THREE.CircleGeometry(.9,10),new THREE.MeshBasicMaterial({color:0x5a0a0a,transparent:true,opacity:.5}),x,.012,z);
  bm.rotation.x=-Math.PI/2;
  const g=new THREE.Group();
  const skin=PM(0x4a5a3a,{roughness:.9});
  const torso=new THREE.Mesh(new THREE.BoxGeometry(1,.34,.4),skin);torso.position.set(0,.2,0);g.add(torso);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.22,8,8),skin);head.position.set(-.7,.24,0);g.add(head);
  const leg1=new THREE.Mesh(new THREE.BoxGeometry(.5,.2,.2),skin);leg1.position.set(.6,.16,0);g.add(leg1);
  const leg2=new THREE.Mesh(new THREE.BoxGeometry(.35,.18,.18),skin);leg2.position.set(1,.14,0);g.add(leg2);
  const arm=new THREE.Mesh(new THREE.BoxGeometry(.4,.16,.18),skin);arm.position.set(-.3,.28,0);g.add(arm);
  g.position.set(x,0,z);g.rotation.y=flip?.4:-.4+Math.PI;
  scene.add(g);
}
fallenBodies.forEach(fb=>makeFallenBody(fb.x,fb.flip));

/* coisas caídas: móveis quebrados, prato/taça, tocha caída */
function makeDebris(px,kind){
  const x=wx(px),z=(kind-1)*.9;
  const wood=PM(0x3a2a1a),metal=PM(0x8a8a92,{metalness:.4,roughness:.5});
  if(kind===0){
    const g=new THREE.Group();
    g.add(new THREE.Mesh(new THREE.BoxGeometry(.9,.15,.15),wood));
    const l1=new THREE.Mesh(new THREE.BoxGeometry(.15,.5,.15),wood);l1.position.set(-.3,.15,0);g.add(l1);
    const l2=new THREE.Mesh(new THREE.BoxGeometry(.15,.5,.15),wood);l2.position.set(.3,.15,0);g.add(l2);
    g.rotation.z=.5;g.position.set(x,.15,z);scene.add(g);
  }else if(kind===1){
    const plate=mesh(new THREE.CylinderGeometry(.32,.32,.04,12),metal,x,.03,z);
    const cup=mesh(new THREE.CylinderGeometry(.1,.08,.22,8),PM(0xcaa24a),x+.4,.11,z);
    cup.rotation.z=1.4;
  }else{
    const handle=mesh(new THREE.CylinderGeometry(.05,.05,.9,6),wood,x,.06,z);
    handle.rotation.z=1.2;
    const head=mesh(new THREE.BoxGeometry(.25,.28,.06),metal,x+.4,.1,z);
    head.rotation.z=1.2;
  }
}
debris.forEach(d=>makeDebris(d.x,d.kind));

/* plataformas elevadas */
platforms.forEach(pf=>{
  if(pf.h>100)return; // chão principal já é o piso 3D
  const x=wx(pf.x)+wx(pf.w)/2,y=wy(pf.y);
  mesh(new THREE.BoxGeometry(wx(pf.w),.5,2.6),PM(0x4a3d33),x,y-.25,0);
});

/* tochas com luz tremeluzente */
const torchLights=[];
function makeTorch(px,side){
  const x=wx(px),z=WALL_Z*side-side*.15;
  mesh(new THREE.CylinderGeometry(.06,.08,1,6),PM(0x2a1d12),x,2.6,z);
  const flame=new THREE.PointLight(0xffaa44,1.4,9);
  flame.position.set(x,3.1,z);scene.add(flame);
  torchLights.push({light:flame,phase:Math.random()*10});
  mesh(new THREE.SphereGeometry(.12,8,8),new THREE.MeshBasicMaterial({color:0xffcc66}),x,3.1,z);
}
[[350,-1],[1100,1],[1850,-1],[2600,1],[3150,-1]].forEach(p=>makeTorch(p[0],p[1]));

/* porta do castelo (meta) */
function makeGoal(px){
  const x=wx(px);
  mesh(new THREE.BoxGeometry(2.4,4,.4),PM(0x3a2a1a),x,2,0);
  mesh(new THREE.BoxGeometry(1.6,3,.2),PM(0x8a1414),x,1.5,.25);
  const crown=mesh(new THREE.ConeGeometry(.3,.4,4),PM(0xcaa24a,{metalness:.5,roughness:.4}),x,3.6,.2);
  crown.rotation.y=Math.PI/4;
}
makeGoal(goal.x);

/* zumbis: patrulham (mesh persistente + estado em update()) */
function makeZombieMesh(){
  const g=new THREE.Group();
  const skin=PM(0x5a6a4a),skinLight=PM(0x7a8a5a),dark=PM(0x1a1410);
  const torso=new THREE.Mesh(new THREE.BoxGeometry(.7,.85,.4),skin);torso.position.y=1.28;g.add(torso);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.28,10,10),skinLight);head.position.y=1.95;g.add(head);
  const eyeL=new THREE.Mesh(new THREE.BoxGeometry(.08,.08,.05),dark);eyeL.position.set(-.1,1.98,.24);g.add(eyeL);
  const eyeR=new THREE.Mesh(new THREE.BoxGeometry(.08,.08,.05),dark);eyeR.position.set(.1,1.98,.24);g.add(eyeR);
  const armL=new THREE.Mesh(new THREE.BoxGeometry(.2,.55,.2),skin);armL.position.set(-.5,1.3,0);g.add(armL);
  const armR=new THREE.Mesh(new THREE.BoxGeometry(.2,.55,.2),skin);armR.position.set(.5,1.3,0);g.add(armR);
  const legL=new THREE.Mesh(new THREE.BoxGeometry(.25,.7,.25),PM(0x3a3a2a));legL.position.set(-.18,.35,0);g.add(legL);
  const legR=new THREE.Mesh(new THREE.BoxGeometry(.25,.7,.25),PM(0x3a3a2a));legR.position.set(.18,.35,0);g.add(legR);
  scene.add(g);
  return g;
}
const zombieMeshes=zombiesData.map(()=>makeZombieMesh());

/* personagem: ninja com capa preta, só olhos e cabelo aparecem */
const player3d=new THREE.Group();
const cloakMat=PM(0x0c0c0e,{roughness:.75});
const body=new THREE.Mesh(new THREE.CylinderGeometry(.26,.4,1.05,10),cloakMat);body.position.y=.72;player3d.add(body);
const cape=new THREE.Mesh(new THREE.ConeGeometry(.5,1.1,8,1,true),PM(0x090909,{roughness:.9,side:THREE.DoubleSide}));
cape.position.set(0,.65,-.12);cape.rotation.x=Math.PI;player3d.add(cape);
const hood=new THREE.Mesh(new THREE.SphereGeometry(.26,12,12),cloakMat);hood.position.y=1.42;player3d.add(hood);
const hair=new THREE.Mesh(new THREE.ConeGeometry(.14,.28,6),PM(0x2a1a10,{roughness:.8}));
hair.position.set(0,1.62,-.08);hair.rotation.x=.3;player3d.add(hair);
const eyeGlowMat=new THREE.MeshBasicMaterial({color:0x8fe7ff});
const eL=new THREE.Mesh(new THREE.SphereGeometry(.035,6,6),eyeGlowMat);eL.position.set(-.09,1.43,.22);player3d.add(eL);
const eR=new THREE.Mesh(new THREE.SphereGeometry(.035,6,6),eyeGlowMat);eR.position.set(.09,1.43,.22);player3d.add(eR);
scene.add(player3d);

/* ===== loop principal ===== */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.033,(now-last)/1000);last=now;
  update(dt);

  // jogador
  player3d.position.set(wx(P.x),wy(P.y+P.h),0);
  player3d.scale.x=P.dir>=0?1:-1;
  player3d.visible=!(P.inv>0&&Math.floor(t*14)%2===0);

  // zumbis
  for(const z of zombies){
    if(!z.mesh)continue;
    z.mesh.visible=z.alive;
    if(z.alive){
      z.mesh.position.set(wx(z.x),Math.abs(Math.sin(t*6))*.04,0);
      z.mesh.scale.x=z.dir>=0?1:-1;
      const jolt=z.hitT>0?Math.sin(z.hitT*40)*.15:0;
      z.mesh.rotation.z=jolt;
    }
  }

  // tochas tremeluzentes
  for(const tl of torchLights){
    tl.light.intensity=1.3*(1+Math.sin(t*9+tl.phase)*.18+Math.sin(t*23+tl.phase)*.08+(Math.random()-.5)*.06);
  }

  // câmera segue o jogador
  const camWX=wx(camX);
  camera.position.set(camWX+2.2,3.1,7.5);
  camera.lookAt(camWX+2.2,1.15,0);

  renderer.render(scene,camera);
}
showMsg('🏰 Jogo do Castelo 3D','Toque ou aperte ESPAÇO para começar — cuidado com os zumbis!');
requestAnimationFrame(frame);
})();
</script>

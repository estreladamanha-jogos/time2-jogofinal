<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Campo Ensolarado</title>
<style>
:root{--ink:#fff3d4;--btn:#ffcf4d;--btn-ink:#3a2412}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0;overflow:hidden;background:#7ec8f0;font-family:"Trebuchet MS",system-ui,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:14px;display:flex;justify-content:space-between;align-items:center;color:#2a3a1a;font-weight:800;font-size:clamp(16px,3vw,24px);text-shadow:0 2px 3px rgba(255,255,255,.5);pointer-events:none;z-index:5}
#hud.off{display:none}
#hearts{display:flex;gap:3px}
.heart{position:relative;display:inline-block;font-size:1em;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.heart.empty{opacity:.3}
.heart .cut{position:absolute;top:0;right:0;bottom:0;width:52%;background:rgba(60,70,50,.85)}
#msg{position:fixed;left:50%;top:14%;transform:translateX(-50%);color:#20301a;font-weight:800;font-size:clamp(18px,4.2vw,34px);text-align:center;text-shadow:0 3px 6px rgba(255,255,255,.7);z-index:10}
#msg.off{display:none}
#msg span{display:block;font-size:.5em;font-weight:700;margin-top:8px}
#touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:6}
body.touch #touch{display:block}
.pad{position:absolute;left:14px;bottom:14px;display:grid;grid-template-columns:70px 70px;grid-template-rows:70px;gap:8px}
.pad button,#jbtn{pointer-events:auto;border:3px solid rgba(255,255,255,.85);background:rgba(30,110,40,.55);color:#fff3d4;font-weight:800;font-size:28px;border-radius:18px;touch-action:none}
.pad button:active,#jbtn:active{background:rgba(40,140,55,.9)}
#jbtn{position:fixed;right:18px;bottom:24px;width:100px;height:100px;border-radius:50%;font-size:18px;pointer-events:auto}
#ammo{display:none;color:#2a3a1a;font-weight:800;font-size:clamp(14px,2.6vw,20px);text-shadow:0 2px 3px rgba(255,255,255,.5)}
#ammo.show{display:block}
#prompt{display:none;position:fixed;left:50%;bottom:22%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;font-weight:800;padding:6px 14px;border-radius:10px;font-size:clamp(14px,2.6vw,18px);z-index:8}
#prompt.show{display:block}
#kbtn{position:fixed;right:130px;bottom:24px;width:64px;height:64px;border-radius:50%;font-size:14px;pointer-events:auto;display:none}
body.touch #kbtn{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="lv">Fase 1 · Campo Ensolarado</div>
  <div id="hearts"></div>
  <div id="ammo">🏹 x0</div>
  <div id="score">🪙 0</div>
</div>
<div id="msg" class="off"><div id="msgTxt"></div><span id="msgSub"></span></div>
<div id="prompt">Aperte E para abrir</div>
<div id="touch">
  <div class="pad">
    <button id="bl">←</button>
    <button id="br">→</button>
  </div>
  <button id="kbtn">E</button>
  <button id="jbtn">PULAR</button>
</div>

<script>
(function(){
'use strict';
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0;
let skyGrad=null;
function resize(){
  W=cv.width=innerWidth;H=cv.height=innerHeight;
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  ctx.lineJoin='round';ctx.lineCap='round';
  // gradiente do céu calculado só quando a tela muda de tamanho (economiza trabalho por frame)
  skyGrad=ctx.createLinearGradient(0,0,0,H);
  skyGrad.addColorStop(0,'#5bb8ec');skyGrad.addColorStop(.7,'#a6e0f5');skyGrad.addColorStop(1,'#cdeffa');
}
addEventListener('resize',resize);resize();
if(matchMedia('(pointer:coarse)').matches)document.body.classList.add('touch');

/* ===== mundo da fase 1: campo ensolarado ===== */
const GRAV=1500,JUMP=-700,SPEED=270,GROUND_Y=560;
const LEVEL_END=2800;
const platforms=[{x:0,y:GROUND_Y,w:LEVEL_END+400,h:260,ground:true}];
// blocos de grama flutuantes pra subir e pegar moedas (alturas alcançáveis com o pulo)
const blocks=[
  {x:420,y:GROUND_Y-110,w:70,h:36},
  {x:560,y:GROUND_Y-200,w:70,h:36},
  {x:900,y:GROUND_Y-120,w:70,h:36},
  {x:1250,y:GROUND_Y-110,w:70,h:36},{x:1330,y:GROUND_Y-200,w:70,h:36},
  {x:1650,y:GROUND_Y-130,w:70,h:36},
  {x:2000,y:GROUND_Y-110,w:70,h:36},{x:2080,y:GROUND_Y-200,w:70,h:36},
  {x:2400,y:GROUND_Y-120,w:70,h:36},
];
const coins=blocks.map(b=>({x:b.x+b.w/2,y:b.y-30,got:false}));
const bushes=[150,340,780,1080,1480,1820,2180,2520].map(x=>({x}));
const trees=[260,700,1150,1600,1950,2350,2680].map((x,i)=>({x,tall:i%2===0}));
const clouds=[100,500,950,1400,1850,2300,2700].map((x,i)=>({x0:x,y:60+((i*37)%90),spd:8+((i*13)%12)}));
// meta: bandeira no fim da fase
const goal={x:LEVEL_END,y:GROUND_Y-140,w:34,h:140};
// monstros: uma lagarta (estilo Pokémon) e um urso maior que o personagem, que tiram meio coração ao encostar
const monstersData=[
  {type:'bug',x:480,pMin:420,pMax:640,w:38,h:24},
  {type:'bear',x:980,pMin:900,pMax:1140,w:76,h:76},
  {type:'bug',x:1500,pMin:1420,pMax:1660,w:38,h:24},
  {type:'bear',x:2020,pMin:1930,pMax:2180,w:76,h:76},
  {type:'bug',x:2500,pMin:2420,pMax:2680,w:38,h:24},
];
let monsters=[];
function resetMonsters(){
  monsters=monstersData.map(m=>({...m,dir:Math.random()<.5?1:-1,spd:.5+Math.random()*.4,alive:true,hitT:0}));
}
// pássaros voando no céu (decoração)
const birdsData=[300,900,1600,2200,2700].map((x,i)=>({x0:x,y:100+((i*29)%70),spd:26+((i*11)%20)}));
// baú com arco e flecha
const chest={x:2650,y:GROUND_Y,opened:false};
// fase 2: castelo grande com portão pra entrar
const LEVEL_END2=1300;
const goal2={x:LEVEL_END2,y:GROUND_Y-190,w:70,h:190};
const platforms2=[{x:0,y:GROUND_Y,w:LEVEL_END2+400,h:260,ground:true}];
// fase 3: dentro do castelo, guardas reais com lanças patrulhando até o trono
const LEVEL_END3=1500;
const goal3={x:LEVEL_END3,y:GROUND_Y-150,w:60,h:150};
const platforms3=[{x:0,y:GROUND_Y,w:LEVEL_END3+400,h:260,ground:true}];
const guardsData=[
  {x:400,pMin:320,pMax:520,w:30,h:70},
  {x:750,pMin:660,pMax:880,w:30,h:70},
  {x:1100,pMin:1000,pMax:1250,w:30,h:70},
];
let guards=[];
function resetGuards(){
  guards=guardsData.map(g=>({...g,dir:Math.random()<.5?1:-1,spd:.45+Math.random()*.3,alive:true,hitT:0}));
}

/* ===== estado ===== */
const HEALTH_MAX=6; // 3 corações, cada um vale 2 (meio coração = 1)
let state='title',selectedChar='jacob',score=0,health=HEALTH_MAX,camX=0,t=0,keys={},touchL=0,touchR=0,jumpBuf=0;
let phase=1,hasBow=false,arrowCount=0,flyingArrows=[];
let P={x:60,y:GROUND_Y-84,vx:0,vy:0,w:32,h:64,onGround:false,coy:0,dir:1,inv:0};
function resetPlayer(){P.x=60;P.y=GROUND_Y-84;P.vx=0;P.vy=0;P.onGround=false;P.coy=0;P.inv=1;camX=0}
function setScore(){$('score').textContent='🪙 '+score}
function setAmmo(){
  const el=$('ammo');
  if(hasBow){el.classList.add('show');el.textContent='🏹 x'+arrowCount}
  else el.classList.remove('show');
}
function setHearts(){
  const el=$('hearts');el.innerHTML='';
  for(let i=0;i<3;i++){
    const v=health-i*2;
    const d=document.createElement('div');
    d.className='heart'+(v<=0?' empty':'');
    d.textContent='❤️';
    if(v===1){const cut=document.createElement('div');cut.className='cut';d.appendChild(cut)}
    el.appendChild(d);
  }
}
function showMsg(txt,sub){$('msgTxt').textContent=txt;$('msgSub').textContent=sub||'';$('msg').classList.remove('off')}
function hideMsg(){$('msg').classList.add('off')}
function showTitleUI(){
  showMsg('☀️ Campo Ensolarado','Toque ou aperte ESPAÇO para começar — cuidado com os monstros!');
  $('hud').classList.add('off');
}
function start(){
  selectedChar='jacob';phase=1;hasBow=false;arrowCount=0;flyingArrows=[];chest.opened=false;guards=[];
  score=0;health=HEALTH_MAX;setScore();setHearts();setAmmo();resetPlayer();resetMonsters();
  coins.forEach(c=>c.got=false);
  state='playing';hideMsg();
  $('lv').textContent='Fase 1 · Campo Ensolarado';
  $('hud').classList.remove('off');
}
function nearChest(){return phase===1&&!chest.opened&&Math.abs(P.x+P.w/2-chest.x)<55}
function openChest(){
  chest.opened=true;hasBow=true;arrowCount=10;setAmmo();
}
function shootArrow(){
  if(!hasBow||arrowCount<=0)return;
  flyingArrows.push({x:P.x+P.w/2,y:P.y+22,vx:620*P.dir,dir:P.dir});
  arrowCount--;setAmmo();
  if(arrowCount<=0)hasBow=false,setAmmo();
}
showTitleUI();
addEventListener('keydown',e=>{
  if((state==='title'||state==='over'||state==='win')&&(e.code==='Space'||e.code==='Enter')){start();return}
  if(state==='playing'&&e.code==='KeyE'&&nearChest())openChest();
  if(state==='playing'&&e.code==='KeyF')shootArrow();
  keys[e.code]=true;
  if(!e.repeat&&(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'))jumpBuf=.12;
});
addEventListener('keyup',e=>{keys[e.code]=false});
cv.addEventListener('pointerdown',()=>{
  if(state==='title'||state==='over'||state==='win')start();
});
$('kbtn').addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(nearChest())openChest();else shootArrow();
});
$('bl').addEventListener('pointerdown',e=>{e.preventDefault();touchL=1});
$('br').addEventListener('pointerdown',e=>{e.preventDefault();touchR=1});
['pointerup','pointercancel','pointerleave'].forEach(ev=>{
  $('bl').addEventListener(ev,()=>touchL=0);
  $('br').addEventListener(ev,()=>touchR=0);
});
$('jbtn').addEventListener('pointerdown',e=>{e.preventDefault();jumpBuf=.12});

function rectsOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function update(dt){
  t+=dt;
  if(state!=='playing')return;
  if(jumpBuf>0)jumpBuf-=dt;
  if(P.inv>0)P.inv-=dt;
  const left=keys.ArrowLeft||keys.KeyA||touchL,right=keys.ArrowRight||keys.KeyD||touchR;
  const ax=(right?1:0)-(left?1:0);
  if(ax)P.dir=ax;
  const want=ax*SPEED;
  const acc=P.onGround?2600:1400;
  if(P.vx<want)P.vx=Math.min(want,P.vx+acc*dt);else if(P.vx>want)P.vx=Math.max(want,P.vx-acc*dt);
  P.x+=P.vx*dt;
  P.x=Math.max(P.x,10);
  if(P.onGround)P.coy=.1;else P.coy-=dt;
  if(jumpBuf>0&&P.coy>0){P.vy=JUMP;P.onGround=false;P.coy=0;jumpBuf=0}
  P.vy+=GRAV*dt;
  const oy=P.y;
  P.y+=P.vy*dt;
  P.onGround=false;
  const floorList=phase===1?[...platforms,...blocks]:phase===2?platforms2:platforms3;
  for(const pf of floorList){
    if(P.x+P.w>pf.x&&P.x<pf.x+pf.w){
      if(P.vy>=0&&oy+P.h<=pf.y+10&&P.y+P.h>=pf.y){
        P.y=pf.y-P.h;P.vy=0;P.onGround=true;
      }
    }
  }
  const pb={x:P.x,y:P.y,w:P.w,h:P.h};
  if(phase===1){
    for(const c of coins){
      if(c.got)continue;
      const cb={x:c.x-12,y:c.y-12,w:24,h:24};
      if(rectsOverlap(pb,cb)){c.got=true;score++;setScore()}
    }
    // monstros: patrulham, podem ser mortos pulando em cima ou tirar meio coração ao encostar
    for(const m of monsters){
      if(!m.alive)continue;
      if(m.hitT>0)m.hitT-=dt;
      m.x+=m.dir*36*m.spd*dt;
      if(m.x<=m.pMin){m.x=m.pMin;m.dir=1}else if(m.x>=m.pMax){m.x=m.pMax;m.dir=-1}
      const mb={x:m.x-m.w/2,y:GROUND_Y-m.h,w:m.w,h:m.h};
      if(rectsOverlap(pb,mb)){
        if(P.vy>0&&P.y+P.h-10<mb.y+14){
          m.alive=false;P.vy=JUMP*.55;P.inv=.3;
        }else if(P.inv<=0){
          health--;setHearts();P.inv=1;P.vy=-360;P.vx=-P.dir*180;
          if(health<=0){state='over';showMsg('😵 Os monstros pegaram você','Toque ou aperte ESPAÇO para tentar de novo')}
        }
      }
    }
    // baú: mostra dica pra abrir quando o jogador está perto
    if(nearChest())$('prompt').classList.add('show');else $('prompt').classList.remove('show');
  }
  if(phase===3){
    // guardas reais com lanças: patrulham e tiram meio coração ao encostar (a lança machuca mais de longe)
    for(const g of guards){
      if(!g.alive)continue;
      if(g.hitT>0)g.hitT-=dt;
      g.x+=g.dir*30*g.spd*dt;
      if(g.x<=g.pMin){g.x=g.pMin;g.dir=1}else if(g.x>=g.pMax){g.x=g.pMax;g.dir=-1}
      const spearReach=g.dir>0?18:-18;
      const gb={x:g.x-g.w/2+Math.min(0,spearReach),y:GROUND_Y-g.h,w:g.w+Math.abs(spearReach),h:g.h};
      if(rectsOverlap(pb,gb)){
        if(P.vy>0&&P.y+P.h-10<GROUND_Y-g.h+16){
          g.alive=false;P.vy=JUMP*.55;P.inv=.3;
        }else if(P.inv<=0){
          health--;setHearts();P.inv=1;P.vy=-360;P.vx=-P.dir*180;
          if(health<=0){state='over';showMsg('🗡️ Os guardas pegaram você','Toque ou aperte ESPAÇO para tentar de novo')}
        }
      }
    }
  }
  // flechas: voam retas e matam o monstro/guarda que acertarem
  for(const a of flyingArrows){
    a.x+=a.vx*dt;
    if(phase===1)for(const m of monsters){
      if(!m.alive)continue;
      const mb={x:m.x-m.w/2,y:GROUND_Y-m.h,w:m.w,h:m.h};
      if(a.x>mb.x&&a.x<mb.x+mb.w&&!a.hit){a.hit=true;m.alive=false}
    }
    if(phase===3)for(const g of guards){
      if(!g.alive)continue;
      const gb={x:g.x-g.w/2,y:GROUND_Y-g.h,w:g.w,h:g.h};
      if(a.x>gb.x&&a.x<gb.x+gb.w&&!a.hit){a.hit=true;g.alive=false}
    }
  }
  flyingArrows=flyingArrows.filter(a=>!a.hit&&Math.abs(a.x-camX)<W+100);
  // avança a fase da passada só enquanto anda no chão (animação de corrida)
  if(P.onGround&&Math.abs(P.vx)>10)walkPhase+=dt*12;else walkPhase=0;
  if(P.y>H+300){resetPlayer()}
  const curGoal=phase===1?goal:phase===2?goal2:goal3;
  if(state==='playing'&&rectsOverlap(pb,curGoal)){
    if(phase===1){
      phase=2;resetPlayer();$('prompt').classList.remove('show');
      $('lv').textContent='Fase 2 · O Castelo';
      showMsg('🏰 Fase 2: o Castelo','Atravesse o portão!');
      setTimeout(()=>{if(state==='playing')hideMsg()},1800);
    }else if(phase===2){
      phase=3;resetPlayer();resetGuards();
      $('lv').textContent='Fase 3 · Guardas Reais';
      showMsg('🗡️ Cuidado, guardas reais!','Pule neles ou atire flechas pra passar');
      setTimeout(()=>{if(state==='playing')hideMsg()},1800);
    }else{
      state='win';showMsg('👑 Você venceu os guardas!','Moedas: '+score+' — Toque ou aperte ESPAÇO para jogar de novo');
    }
  }
  const curEnd=phase===1?LEVEL_END:phase===2?LEVEL_END2:LEVEL_END3;
  const targetCam=Math.max(0,Math.min(curEnd-W+90,P.x-W*.4));
  camX+=(targetCam-camX)*Math.min(1,dt*4);
}

/* ===== desenho estilo cartoon: formas arredondadas + contorno preto grosso ===== */
function outline(w){ctx.lineWidth=w||3;ctx.strokeStyle='#1a1a1a';ctx.stroke()}
function drawSky(cam){
  ctx.fillStyle=skyGrad;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ffe26b';
  ctx.beginPath();ctx.arc(W*.82,H*.16,46,0,Math.PI*2);ctx.fill();outline(4);
  ctx.fillStyle='rgba(255,221,85,.35)';
  ctx.beginPath();ctx.arc(W*.82,H*.16,64,0,Math.PI*2);ctx.fill();
  for(const c of clouds){
    const sx=c.x0-cam*.25;
    if(sx<-160||sx>W+160)continue;
    drawCloud(sx,c.y);
  }
  for(const b of birdsData){
    const bx=(b.x0+t*b.spd)-cam*.4;
    const wrapped=((bx%(W+400))+(W+400))%(W+400)-200;
    drawBird(wrapped,b.y);
  }
}
function drawCloud(x,y){
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.ellipse(x,y,32,20,0,0,Math.PI*2);
  ctx.ellipse(x+28,y-8,24,18,0,0,Math.PI*2);
  ctx.ellipse(x-28,y-4,22,16,0,0,Math.PI*2);
  ctx.ellipse(x+8,y-16,20,16,0,0,Math.PI*2);
  ctx.fill();outline(2.5);
}
function drawGround(cam){
  const g=ctx.createLinearGradient(0,GROUND_Y+18,0,H);
  g.addColorStop(0,'#a06a34');g.addColorStop(1,'#7a4e24');
  ctx.fillStyle=g;
  ctx.fillRect(0,GROUND_Y+18,W,H-GROUND_Y);
  ctx.fillStyle='#6bc23a';
  ctx.fillRect(0,GROUND_Y,W,22);
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(0,GROUND_Y+18);ctx.lineTo(W,GROUND_Y+18);ctx.stroke();
  // tufos de grama arredondados
  ctx.fillStyle='#57a832';
  for(let x=-((cam*1)%26);x<W+26;x+=26){
    ctx.beginPath();
    ctx.moveTo(x,GROUND_Y+4);
    ctx.quadraticCurveTo(x+4,GROUND_Y-10,x+9,GROUND_Y+4);
    ctx.quadraticCurveTo(x+13,GROUND_Y-8,x+17,GROUND_Y+4);
    ctx.fill();
  }
}
function drawTree(x,tall,cam){
  const bx=x-cam;if(bx<-80||bx>W+80)return;
  const y=GROUND_Y,h=tall?150:110,tw=18;
  ctx.fillStyle='#8a5a2e';
  ctx.beginPath();ctx.roundRect(bx-tw/2,y-h*.45,tw,h*.45,6);ctx.fill();outline(3);
  ctx.fillStyle='#3aa348';
  ctx.beginPath();ctx.arc(bx,y-h*.45-30,44,0,Math.PI*2);ctx.fill();outline(3.5);
  ctx.fillStyle='#4dc25c';
  ctx.beginPath();ctx.arc(bx-24,y-h*.45-14,28,0,Math.PI*2);ctx.fill();outline(3);
  ctx.beginPath();ctx.arc(bx+26,y-h*.45-16,26,0,Math.PI*2);ctx.fill();outline(3);
  ctx.fillStyle='rgba(255,255,255,.25)';
  ctx.beginPath();ctx.arc(bx-16,y-h*.45-42,12,0,Math.PI*2);ctx.fill();
}
function drawBush(x,cam){
  const bx=x-cam;if(bx<-60||bx>W+60)return;
  const y=GROUND_Y;
  ctx.fillStyle='#3aa348';
  ctx.beginPath();ctx.arc(bx-14,y-6,16,0,Math.PI*2);ctx.fill();outline(3);
  ctx.beginPath();ctx.arc(bx+14,y-6,16,0,Math.PI*2);ctx.fill();outline(3);
  ctx.beginPath();ctx.arc(bx,y-16,18,0,Math.PI*2);ctx.fill();outline(3);
  ctx.fillStyle='#4dc25c';
  ctx.beginPath();ctx.arc(bx,y-8,14,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.3)';
  ctx.beginPath();ctx.arc(bx-6,y-18,6,0,Math.PI*2);ctx.fill();
}
function drawBlock(pf,cam){
  const bx=pf.x-cam;
  const g=ctx.createLinearGradient(0,pf.y,0,pf.y+pf.h);
  g.addColorStop(0,'#a06a34');g.addColorStop(1,'#8a5a2e');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.roundRect(bx,pf.y,pf.w,pf.h,8);ctx.fill();outline(3);
  ctx.fillStyle='#6bc23a';
  ctx.beginPath();ctx.roundRect(bx,pf.y,pf.w,12,[8,8,0,0]);ctx.fill();
  ctx.fillStyle='#57a832';
  for(let x=6;x<pf.w-6;x+=14){
    ctx.beginPath();
    ctx.moveTo(bx+x,pf.y+4);
    ctx.quadraticCurveTo(bx+x+3,pf.y-6,bx+x+6,pf.y+4);
    ctx.fill();
  }
}
function drawCoin(c,cam){
  if(c.got)return;
  const x=c.x-cam;if(x<-30||x>W+30)return;
  const bob=Math.sin(t*3+c.x)*3;
  ctx.fillStyle='#ffd94d';
  ctx.beginPath();ctx.ellipse(x,c.y+bob,9,9,0,0,Math.PI*2);ctx.fill();outline(2.5);
  ctx.fillStyle='#f0b429';
  ctx.beginPath();ctx.ellipse(x,c.y+bob,5,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)';
  ctx.beginPath();ctx.ellipse(x-3,c.y+bob-3,2.4,2.4,0,0,Math.PI*2);ctx.fill();
}
// homem (Jacob): cabelo cacheado, barba, blusa vermelha, faixa vermelha, short branco, sapato branco — estilo cartoon
// phase = fase da passada (contínua), jumping = true quando está no ar
function drawMan(x,y,dir,phase,jumping){
  ctx.save();
  if(dir<0){ctx.translate(x+32,y);ctx.scale(-1,1);}else{ctx.translate(x,y);}
  // pernas alternam de verdade (uma na frente, outra atrás), e ficam numa pose de pulo no ar
  const legL=jumping?-.35:Math.sin(phase)*.3;
  const legR=jumping?.28:Math.sin(phase+Math.PI)*.3;
  // braços balançam em oposição às pernas (corrida natural) ou erguidos no pulo
  const armL=jumping?-.9:Math.sin(phase+Math.PI)*.45;
  const armR=jumping?-.9:Math.sin(phase)*.45;
  // o corpo todo sobe e desce um pouco a cada passada
  const bob=jumping?-3:Math.abs(Math.sin(phase))*2.2;
  ctx.translate(0,-bob);
  function lg(x0,y0,x1,y1,c0,c1){const g=ctx.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,c0);g.addColorStop(1,c1);return g}

  // perna de trás (mais escura, sugere profundidade) — coxa + canela articuladas (joelho dobra)
  const kneeL=jumping?.5:Math.max(0,-Math.cos(phase))*.6;
  ctx.save();ctx.translate(9,44);ctx.rotate(legL);
  ctx.fillStyle=lg(-4,0,4,0,'#5a3a20','#3f2814');
  ctx.beginPath();ctx.roundRect(-4,0,8,10,4);ctx.fill();outline(2.5);
  ctx.save();ctx.translate(0,9);ctx.rotate(kneeL);
  ctx.fillStyle=lg(-4,0,4,0,'#5a3a20','#3f2814');
  ctx.beginPath();ctx.roundRect(-4,0,8,9,3);ctx.fill();outline(2.5);
  ctx.fillStyle='#e8e8e8';ctx.beginPath();ctx.roundRect(-5,8,10,9,4);ctx.fill();outline(2.5);
  ctx.restore();
  ctx.restore();
  // braço de trás
  ctx.save();ctx.translate(3,21);ctx.rotate(armL);
  ctx.fillStyle='#c81818';ctx.beginPath();ctx.roundRect(-3,0,6,16,3);ctx.fill();outline(2.5);
  ctx.fillStyle='#4a2f18';ctx.beginPath();ctx.roundRect(-2,14,4,6,2);ctx.fill();outline(1.8);
  ctx.restore();

  // short branco
  ctx.fillStyle=lg(4,30,4,42,'#fff','#e6e6e6');
  ctx.beginPath();ctx.roundRect(4,30,24,12,5);ctx.fill();outline(2.5);
  // blusa vermelha (gradiente lateral pra dar volume 3D)
  ctx.fillStyle=lg(2,10,30,10,'#ff5a5a','#b81414');
  ctx.beginPath();ctx.roundRect(2,10,28,22,8);ctx.fill();outline(3);
  ctx.fillStyle='rgba(255,255,255,.28)';
  ctx.beginPath();ctx.roundRect(5,12,7,14,4);ctx.fill();

  // perna da frente — coxa + canela articuladas (joelho dobra)
  const kneeR=jumping?.5:Math.max(0,-Math.cos(phase+Math.PI))*.6;
  ctx.save();ctx.translate(23,44);ctx.rotate(legR);
  ctx.fillStyle=lg(-4,0,4,0,'#6a4526','#4a2f18');
  ctx.beginPath();ctx.roundRect(-4,0,8,10,4);ctx.fill();outline(2.5);
  ctx.save();ctx.translate(0,9);ctx.rotate(kneeR);
  ctx.fillStyle=lg(-4,0,4,0,'#6a4526','#4a2f18');
  ctx.beginPath();ctx.roundRect(-4,0,8,9,3);ctx.fill();outline(2.5);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(-5,8,10,9,4);ctx.fill();outline(2.5);
  ctx.restore();
  ctx.restore();
  // braço da frente
  ctx.save();ctx.translate(29,21);ctx.rotate(armR);
  ctx.fillStyle=lg(-3,0,3,0,'#ff3a3a','#e02525');
  ctx.beginPath();ctx.roundRect(-3,0,6,16,3);ctx.fill();outline(2.5);
  ctx.fillStyle='#6a4526';ctx.beginPath();ctx.roundRect(-2,14,4,6,2);ctx.fill();outline(1.8);
  ctx.restore();

  // cabeça (gradiente esférico pra dar sensação de volume/3D)
  const headG=ctx.createRadialGradient(12,-2,2,16,2,14);
  headG.addColorStop(0,'#f2c08e');headG.addColorStop(1,'#d99a66');
  ctx.fillStyle=headG;
  ctx.beginPath();ctx.arc(16,2,12,0,Math.PI*2);ctx.fill();outline(3);
  // cabelo cacheado (bolinhas)
  ctx.fillStyle='#2a1a10';
  for(let i=0;i<6;i++){
    ctx.beginPath();ctx.arc(6+i*4,-4+((i%2)*3),4,0,Math.PI*2);ctx.fill();outline(2);
  }
  // barba
  ctx.fillStyle='#2a1a10';ctx.beginPath();ctx.roundRect(9,10,14,5,2.5);ctx.fill();
  // faixa vermelha na cabeça
  ctx.fillStyle='#e02525';ctx.beginPath();ctx.roundRect(4,-2,24,6,3);ctx.fill();outline(2);
  // olho
  ctx.fillStyle='#1a1410';ctx.beginPath();ctx.arc(22.5,2.5,1.8,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
// lagarta estilo Pokémon (verde, segmentada, olhos grandes) — estilo cartoon
function drawBug(m){
  const x=m.x-camX;if(x<-60||x>W+60)return;
  const y=GROUND_Y,flip=m.dir<0;
  ctx.save();
  if(flip){ctx.translate(x+m.w/2,y);ctx.scale(-1,1);}else{ctx.translate(x-m.w/2,y);}
  const wob=Math.sin(t*8+m.x)*2;
  ctx.fillStyle='#5fae3a';
  for(let i=0;i<4;i++){
    ctx.beginPath();ctx.ellipse(6+i*9,-10+ (i%2?wob*.5:-wob*.5),7,9,0,0,Math.PI*2);ctx.fill();outline(2.5);
  }
  ctx.fillStyle='#8be05c';
  ctx.beginPath();ctx.ellipse(m.w-6,-12,11,12,0,0,Math.PI*2);ctx.fill();outline(3);
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.ellipse(m.w-10,-15,4,4,0,0,Math.PI*2);ctx.fill();outline(1.5);
  ctx.beginPath();ctx.ellipse(m.w-2,-15,4,4,0,0,Math.PI*2);ctx.fill();outline(1.5);
  ctx.fillStyle='#1a1410';
  ctx.beginPath();ctx.arc(m.w-10,-15,1.8,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(m.w-2,-15,1.8,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#e8536b';ctx.lineWidth=3;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(m.w-2,-22);ctx.lineTo(m.w+2,-28);ctx.stroke();
  ctx.beginPath();ctx.moveTo(m.w-14,-22);ctx.lineTo(m.w-18,-28);ctx.stroke();
  ctx.restore();
}
// urso, maior que o personagem — estilo cartoon
function drawBear(m){
  const x=m.x-camX;if(x<-90||x>W+90)return;
  const y=GROUND_Y,flip=m.dir<0;
  ctx.save();
  if(flip){ctx.translate(x+m.w/2,y);ctx.scale(-1,1);}else{ctx.translate(x-m.w/2,y);}
  const walk=Math.sin(t*6+m.x)*3;
  ctx.fillStyle='#7a5232';
  ctx.beginPath();ctx.roundRect(10,-24+walk,16,24,8);ctx.fill();outline(3);
  ctx.beginPath();ctx.roundRect(m.w-26,-24-walk,16,24,8);ctx.fill();outline(3);
  const bodyG=ctx.createRadialGradient(m.w*.4,-m.h*.62,4,m.w/2,-m.h*.5,m.w*.5);
  bodyG.addColorStop(0,'#a8825a');bodyG.addColorStop(1,'#7a5836');
  ctx.fillStyle=bodyG;
  ctx.beginPath();ctx.ellipse(m.w/2,-m.h*.5,m.w*.42,m.h*.34,0,0,Math.PI*2);ctx.fill();outline(4);
  ctx.fillStyle='#8a6238';
  ctx.beginPath();ctx.ellipse(m.w*.78,-m.h*.78,m.h*.26,m.h*.24,0,0,Math.PI*2);ctx.fill();outline(3.5);
  ctx.fillStyle='#5c3f22';
  ctx.beginPath();ctx.ellipse(m.w*.9,-m.h*.86,7,7,0,0,Math.PI*2);ctx.fill();outline(2.5);
  ctx.beginPath();ctx.ellipse(m.w*.68,-m.h*.98,8,8,0,0,Math.PI*2);ctx.fill();outline(2.5);
  ctx.fillStyle='#c99a68';
  ctx.beginPath();ctx.ellipse(m.w*.9,-m.h*.76,5,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1a1410';
  ctx.beginPath();ctx.arc(m.w*.83,-m.h*.86,2.2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(m.w*.71,-m.h*.84,2.2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(m.w*.9,-m.h*.78,2.8,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawMonster(m){
  if(!m.alive)return;
  drawShadow(m.x-camX,GROUND_Y+2,m.w*.42);
  if(m.type==='bug')drawBug(m);else drawBear(m);
}
// pássaro simples em V que bate as asas, voando pelo céu
function drawBird(x,y){
  const flap=Math.sin(t*10+x)*6;
  ctx.strokeStyle='#3a2a1a';ctx.lineWidth=2.5;ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x-10,y+flap*.3);ctx.quadraticCurveTo(x-4,y-6-flap,x,y);
  ctx.quadraticCurveTo(x+4,y-6+flap,x+10,y+flap*.3);
  ctx.stroke();
}
function drawShadow(x,y,w){
  ctx.fillStyle='rgba(0,0,0,.22)';
  ctx.beginPath();ctx.ellipse(x,y,w,w*.28,0,0,Math.PI*2);ctx.fill();
}
function drawBow(x,y,dir){
  ctx.save();
  ctx.translate(x+(dir>0?27:5),y+22);
  ctx.scale(dir,1);
  ctx.strokeStyle='#6a4526';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(0,0,13,-1.05,1.05);ctx.stroke();
  ctx.strokeStyle='#ddd';ctx.lineWidth=1.4;
  ctx.beginPath();
  ctx.moveTo(13*Math.cos(-1.05),13*Math.sin(-1.05));
  ctx.lineTo(13*Math.cos(1.05),13*Math.sin(1.05));
  ctx.stroke();
  ctx.restore();
}
let walkPhase=0;
function drawPlayer(){
  if(P.inv>0&&Math.floor(t*14)%2===0)return;
  drawShadow(P.x-camX+16,GROUND_Y+2,15);
  drawMan(P.x-camX,P.y,P.dir,walkPhase,!P.onGround);
  if(hasBow)drawBow(P.x-camX,P.y,P.dir);
}
function drawChest(){
  if(chest.opened)return;
  const x=chest.x-camX;if(x<-40||x>W+40)return;
  const y=GROUND_Y;
  drawShadow(x,y+2,20);
  ctx.fillStyle='#8a5a2e';
  ctx.beginPath();ctx.roundRect(x-20,y-20,40,20,4);ctx.fill();outline(3);
  ctx.fillStyle='#a06a34';
  ctx.beginPath();ctx.roundRect(x-22,y-32,44,16,[8,8,3,3]);ctx.fill();outline(3);
  ctx.fillStyle='#ffd94d';
  ctx.beginPath();ctx.roundRect(x-4,y-24,8,10,2);ctx.fill();outline(2);
}
function drawArrow(a){
  const x=a.x-camX;if(x<-30||x>W+30)return;
  ctx.save();ctx.translate(x,a.y);ctx.scale(a.dir,1);
  ctx.strokeStyle='#5a3a20';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(6,0);ctx.stroke();
  ctx.fillStyle='#8a8a92';
  ctx.beginPath();ctx.moveTo(6,0);ctx.lineTo(-2,-4);ctx.lineTo(-2,4);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#e02525';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(-9,-3);ctx.moveTo(-14,0);ctx.lineTo(-9,3);ctx.stroke();
  ctx.restore();
}
function drawCastle(cam){
  const x=goal2.x-camX;
  // torres grandes ao fundo, atrás do portão
  ctx.fillStyle='#8a8a92';
  [-150,150].forEach(off=>{
    ctx.beginPath();ctx.roundRect(x+off-30,GROUND_Y-260,60,260,6);ctx.fill();outline(4);
    ctx.fillStyle='#6b6b74';
    ctx.beginPath();ctx.moveTo(x+off-36,GROUND_Y-260);ctx.lineTo(x+off,GROUND_Y-300);ctx.lineTo(x+off+36,GROUND_Y-260);ctx.closePath();ctx.fill();outline(4);
    ctx.fillStyle='#8a8a92';
  });
  // muralha central
  ctx.fillStyle='#9a9aa2';
  ctx.beginPath();ctx.roundRect(x-150,GROUND_Y-190,300,190,[10,10,0,0]);ctx.fill();outline(4);
  for(let i=-5;i<=5;i++){
    ctx.fillStyle='#7a7a84';
    ctx.beginPath();ctx.roundRect(x+i*24-8,GROUND_Y-206,16,16,3);ctx.fill();outline(2.5);
  }
  // portão (goal2)
  ctx.fillStyle='#4a2f18';
  ctx.beginPath();ctx.roundRect(goal2.x-camX-goal2.w/2,goal2.y,goal2.w,goal2.h,[goal2.w/2,goal2.w/2,0,0]);ctx.fill();outline(3.5);
  ctx.fillStyle='#2a1a10';
  ctx.beginPath();ctx.roundRect(goal2.x-camX-goal2.w/2+8,goal2.y+10,goal2.w-16,goal2.h-10,[goal2.w/2-6,goal2.w/2-6,0,0]);ctx.fill();
}
// guarda real: armadura prateada, capacete e uma lança comprida apontada pra frente
function drawGuard(g){
  if(!g.alive)return;
  const x=g.x-camX;if(x<-60||x>W+60)return;
  const y=GROUND_Y,flip=g.dir<0;
  drawShadow(x,y+2,g.w*.5);
  ctx.save();
  if(flip){ctx.translate(x+g.w/2,y);ctx.scale(-1,1);}else{ctx.translate(x-g.w/2,y);}
  const walk=Math.sin(t*7+g.x)*.08;
  // pernas
  ctx.fillStyle='#2a2a30';
  ctx.beginPath();ctx.roundRect(4,-26,9,26,3);ctx.fill();outline(2.5);
  ctx.beginPath();ctx.roundRect(g.w-13,-26,9,26,3);ctx.fill();outline(2.5);
  // lança (cabo + ponta), sempre à frente
  ctx.strokeStyle='#6a4526';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(g.w-6,-g.h*.72);ctx.lineTo(g.w+34,-g.h*.9-walk*20);ctx.stroke();
  ctx.fillStyle='#c7ccd6';
  ctx.beginPath();ctx.moveTo(g.w+34,-g.h*.9-walk*20);ctx.lineTo(g.w+24,-g.h*.98-walk*20);ctx.lineTo(g.w+44,-g.h*.98-walk*20);ctx.closePath();ctx.fill();outline(1.8);
  // corpo com armadura
  const armorG=ctx.createLinearGradient(0,-g.h*.75,0,-g.h*.3);
  armorG.addColorStop(0,'#c7ccd6');armorG.addColorStop(1,'#8a909c');
  ctx.fillStyle=armorG;
  ctx.beginPath();ctx.roundRect(2,-g.h*.75,g.w-4,g.h*.46,5);ctx.fill();outline(3);
  ctx.fillStyle='#8a1414';
  ctx.beginPath();ctx.roundRect(g.w*.35,-g.h*.7,g.w*.3,g.h*.34,2);ctx.fill();
  // braços
  ctx.fillStyle='#8a909c';
  ctx.beginPath();ctx.roundRect(-3,-g.h*.72,6,16,3);ctx.fill();outline(2);
  ctx.beginPath();ctx.roundRect(g.w-3,-g.h*.72,6,16,3);ctx.fill();outline(2);
  // capacete com viseira
  ctx.fillStyle='#9aa0ac';
  ctx.beginPath();ctx.arc(g.w/2,-g.h*.82,10,Math.PI,0);ctx.fill();outline(2.5);
  ctx.fillStyle='#c7ccd6';ctx.beginPath();ctx.roundRect(g.w/2-10,-g.h*.82,20,7,2);ctx.fill();outline(2);
  ctx.fillStyle='#1a1410';ctx.fillRect(g.w/2-4,-g.h*.8,8,3);
  ctx.fillStyle='#caa24a';
  ctx.beginPath();ctx.moveTo(g.w/2,-g.h*.92-6);ctx.lineTo(g.w/2-3,-g.h*.92);ctx.lineTo(g.w/2+3,-g.h*.92);ctx.closePath();ctx.fill();
  ctx.restore();
}
// pátio interno do castelo (fase 3): paredes de pedra com tochas
function drawCastleInterior(cam){
  ctx.fillStyle='#3a3230';
  ctx.fillRect(0,0,W,GROUND_Y+20);
  ctx.fillStyle='#4a4038';
  for(let x=-((cam*.6)%90);x<W+90;x+=90){
    ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=2;
    ctx.strokeRect(x,60,84,GROUND_Y-40);
  }
  // trono no fim da fase (goal3)
  const gx=goal3.x-cam;
  ctx.fillStyle='#caa24a';
  ctx.beginPath();ctx.roundRect(gx-30,GROUND_Y-goal3.h,60,goal3.h,[10,10,0,0]);ctx.fill();outline(3.5);
  ctx.fillStyle='#8a1414';
  ctx.beginPath();ctx.roundRect(gx-20,GROUND_Y-goal3.h+18,40,goal3.h-30,4);ctx.fill();outline(2.5);
}
function drawGoalFlag(){
  const x=goal.x-camX;if(x<-40||x>W+40)return;
  const y=goal.y;
  ctx.fillStyle='#a06a34';
  ctx.beginPath();ctx.roundRect(x-3,y,6,goal.h,3);ctx.fill();outline(2.5);
  const wave=Math.sin(t*4)*4;
  ctx.fillStyle='#f0505f';
  ctx.beginPath();
  ctx.moveTo(x+3,y+4);ctx.lineTo(x+40+wave,y+16);ctx.lineTo(x+3,y+30);
  ctx.closePath();ctx.fill();outline(2.5);
  ctx.fillStyle='#ffd94d';
  ctx.beginPath();ctx.arc(x,y-3,5,0,Math.PI*2);ctx.fill();outline(2);
}
function draw(){
  drawSky(camX);
  if(phase===1){
    for(const tr of trees)drawTree(tr.x,tr.tall,camX);
    drawGround(camX);
    for(const b of bushes)drawBush(b.x,camX);
    for(const bl of blocks)drawBlock(bl,camX);
    for(const c of coins)drawCoin(c,camX);
    for(const m of monsters)drawMonster(m);
    drawChest();
    drawGoalFlag();
  }else if(phase===2){
    drawGround(camX);
    drawCastle(camX);
  }else{
    drawCastleInterior(camX);
    drawGround(camX);
    for(const g of guards)drawGuard(g);
  }
  for(const a of flyingArrows)drawArrow(a);
  drawPlayer();
}

/* ===== tela de título (só o Jacob) ===== */
function drawTitle(){
  drawSky(0);
  drawGround(0);
  const cx=W*.5,baseY=GROUND_Y;
  ctx.fillStyle='rgba(255,255,255,.35)';
  ctx.beginPath();ctx.ellipse(cx,baseY+6,46,12,0,0,Math.PI*2);ctx.fill();
  drawMan(cx-16,baseY-84,1,t*1.2,false);
}

let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.033,(now-last)/1000);last=now;
  update(dt);
  ctx.clearRect(0,0,W,H);
  if(state==='title')drawTitle();else draw();
}
requestAnimationFrame(frame);
})();
</script>

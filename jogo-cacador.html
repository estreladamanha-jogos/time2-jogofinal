<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Caçador de Recompensas 3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--ink:#fff3d4;--btn:#ffcf4d;--btn-ink:#3a2412}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0;overflow:hidden;background:#0d0906;font-family:"Trebuchet MS",system-ui,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:14px;display:flex;justify-content:space-between;color:#fff;font-weight:800;font-size:clamp(16px,3vw,24px);text-shadow:0 2px 4px rgba(0,0,0,.6);pointer-events:none;z-index:5}
#msg{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);color:#fff;font-weight:800;font-size:clamp(20px,5vw,40px);text-align:center;text-shadow:0 3px 8px rgba(0,0,0,.7);z-index:10}
#msg.off{display:none}
#msg span{display:block;font-size:.5em;font-weight:700;margin-top:10px}
#touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:6}
body.touch #touch{display:block}
.pad{position:absolute;left:14px;bottom:14px;display:grid;grid-template-columns:70px 70px;grid-template-rows:70px;gap:8px}
.pad button,#jbtn{pointer-events:auto;border:3px solid rgba(255,255,255,.7);background:rgba(60,30,90,.5);color:#fff3d4;font-weight:800;font-size:28px;border-radius:18px;touch-action:none}
.pad button:active,#jbtn:active{background:rgba(90,40,130,.85)}
#jbtn{position:fixed;right:18px;bottom:24px;width:100px;height:100px;border-radius:50%;font-size:18px;pointer-events:auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="lv">Fase 1 · Salão Medieval</div>
  <div id="score">🪙 0</div>
  <div id="lives">❤️❤️❤️</div>
</div>
<div id="msg" class="off"><div id="msgTxt"></div><span id="msgSub"></span></div>
<div id="touch">
  <div class="pad">
    <button id="bl">←</button>
    <button id="br">→</button>
  </div>
  <button id="jbtn">PULAR</button>
</div>

<script>
(function(){
'use strict';
const cv=document.getElementById('c');
const $=id=>document.getElementById(id);
let W=innerWidth,H=innerHeight;
if(matchMedia('(pointer:coarse)').matches)document.body.classList.add('touch');

/* ===== mundo da fase 1 (física em "pixels") ===== */
const GRAV=1500,JUMP=-620,SPEED=270,GROUND_Y=620;
const LEVEL_END=3100;
// chão de pedra agora contínuo (sem buracos) — plataformas de corrente ficam como bônus
const platforms=[
  {x:0,y:GROUND_Y,w:LEVEL_END+400,h:200,ground:true},
  {x:560,y:GROUND_Y-120,w:150,h:24,chain:true},
  {x:1260,y:GROUND_Y-90,w:140,h:24,chain:true},
  {x:1520,y:GROUND_Y-170,w:140,h:24,chain:true},
  {x:1780,y:GROUND_Y-90,w:140,h:24,chain:true},
  {x:2380,y:GROUND_Y-110,w:150,h:24,chain:true},
  {x:2650,y:GROUND_Y-200,w:150,h:24,chain:true},
];
const columns=[120,480,1000,1400,1700,2000,2320,2700,3050];
const tableSets=[300,1080,1900,2550].map(x=>({x}));
const portraits=[700,1350,2100,2820].map(x=>({x}));
const vases=[420,980,1620,2250,2900].map((x,i)=>({x,side:i%2===0?1:-1}));
const coins=[];
for(const pf of platforms){
  if(pf.chain){
    coins.push({x:pf.x+pf.w*.3,y:pf.y-34,got:false});
    coins.push({x:pf.x+pf.w*.7,y:pf.y-34,got:false});
  }
}
[840,2080,2130,2180].forEach(x=>coins.push({x,y:GROUND_Y-40,got:false}));
const goal={x:LEVEL_END,y:GROUND_Y-150,w:70,h:150};

/* ===== estado ===== */
let state='title',lives=3,score=0,camX=0,t=0,keys={},touchL=0,touchR=0,jumpBuf=0;
let P={x:60,y:GROUND_Y-70,vx:0,vy:0,w:30,h:50,onGround:false,coy:0,inv:0,dir:1};
function resetPlayer(){P.x=60;P.y=GROUND_Y-70;P.vx=0;P.vy=0;P.onGround=false;P.coy=0;P.inv=1;camX=0}
function setLives(){$('lives').textContent='❤️'.repeat(Math.max(0,lives))+'🖤'.repeat(Math.max(0,3-lives))}
function setScore(){$('score').textContent='🪙 '+score}
function showMsg(txt,sub){$('msgTxt').textContent=txt;$('msgSub').textContent=sub||'';$('msg').classList.remove('off')}
function hideMsg(){$('msg').classList.add('off')}
function start(){lives=3;score=0;setLives();setScore();resetPlayer();coins.forEach(c=>c.got=false);state='playing';hideMsg()}
addEventListener('keydown',e=>{
  if((state==='title'||state==='over'||state==='win')&&(e.code==='Space'||e.code==='Enter')){start();return}
  keys[e.code]=true;
  if(!e.repeat&&(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'))jumpBuf=.12;
});
addEventListener('keyup',e=>{keys[e.code]=false});
cv.addEventListener('pointerdown',()=>{if(state==='title'||state==='over'||state==='win')start()});
$('bl').addEventListener('pointerdown',e=>{e.preventDefault();touchL=1});
$('br').addEventListener('pointerdown',e=>{e.preventDefault();touchR=1});
['pointerup','pointercancel','pointerleave'].forEach(ev=>{
  $('bl').addEventListener(ev,()=>touchL=0);
  $('br').addEventListener(ev,()=>touchR=0);
});
$('jbtn').addEventListener('pointerdown',e=>{e.preventDefault();jumpBuf=.12});

function rectsOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function update(dt){
  t+=dt;
  if(state!=='playing')return;
  if(jumpBuf>0)jumpBuf-=dt;
  if(P.inv>0)P.inv-=dt;
  const left=keys.ArrowLeft||keys.KeyA||touchL,right=keys.ArrowRight||keys.KeyD||touchR;
  const ax=(right?1:0)-(left?1:0);
  if(ax)P.dir=ax;
  const want=ax*SPEED;
  const acc=P.onGround?2600:1400;
  if(P.vx<want)P.vx=Math.min(want,P.vx+acc*dt);else if(P.vx>want)P.vx=Math.max(want,P.vx-acc*dt);
  P.x+=P.vx*dt;
  P.x=Math.max(P.x,10);
  if(P.onGround)P.coy=.1;else P.coy-=dt;
  if(jumpBuf>0&&P.coy>0){P.vy=JUMP;P.onGround=false;P.coy=0;jumpBuf=0}
  P.vy+=GRAV*dt;
  const oy=P.y;
  P.y+=P.vy*dt;
  P.onGround=false;
  for(const pf of platforms){
    if(P.x+P.w>pf.x&&P.x<pf.x+pf.w){
      if(P.vy>=0&&oy+P.h<=pf.y+10&&P.y+P.h>=pf.y){
        P.y=pf.y-P.h;P.vy=0;P.onGround=true;
      }
    }
  }
  const pb={x:P.x,y:P.y,w:P.w,h:P.h};
  for(const c of coins){
    if(c.got)continue;
    const cb={x:c.x-12,y:c.y-12,w:24,h:24};
    if(rectsOverlap(pb,cb)){c.got=true;score++;setScore()}
  }
  if(P.y>H+3000){
    lives--;setLives();
    if(lives<=0){state='over';showMsg('💀 Você caiu no vazio','Toque ou aperte ESPAÇO para tentar de novo')}
    else{resetPlayer();P.inv=1.2}
  }
  if(rectsOverlap(pb,goal)){
    state='win';showMsg('👑 Fase 1 completa!','Moedas: '+score+' — Toque ou aperte ESPAÇO para jogar de novo');
  }
  const targetCam=Math.max(0,Math.min(LEVEL_END-W+90,P.x-W*.4));
  camX+=(targetCam-camX)*Math.min(1,dt*4);
}

/* ===== mundo 3D (Three.js) ===== */
const S=40;
const wx=px=>px/S;
const wy=py=>(GROUND_Y-py)/S;
const X0=-3, XEND=(LEVEL_END+400)/S;
const CEIL=6.4;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x120c08);
scene.fog=new THREE.FogExp2(0x120c08,.02);
const camera=new THREE.PerspectiveCamera(58,W/H,.1,300);
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(W,H);
function resize(){W=innerWidth;H=innerHeight;camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H)}
addEventListener('resize',resize);

scene.add(new THREE.HemisphereLight(0xaa8866,0x140b06,.6));
const sun=new THREE.DirectionalLight(0xffcf9a,.3);
sun.position.set(8,15,6);scene.add(sun);

function PM(color,opts){return new THREE.MeshStandardMaterial(Object.assign({color,roughness:.8,metalness:.08},opts||{}))}
function mesh(geo,mat,x,y,z){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);scene.add(m);return m}
function texFromCanvas(draw,w,h){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);return new THREE.CanvasTexture(c)}
function seededRand(n){const s=Math.sin(n*12.9898)*43758.5453;return s-Math.floor(s)}

/* chão de pedra, bem plano e visível */
const floorTex=texFromCanvas((c,w,h)=>{
  c.fillStyle='#7a7168';c.fillRect(0,0,w,h);
  c.strokeStyle='rgba(20,15,10,.55)';c.lineWidth=3;
  for(let y=0;y<h;y+=32)for(let x=0;x<w;x+=32){
    c.strokeRect(x,y,32,32);
    c.fillStyle=`rgba(0,0,0,${.03+seededRand(x+y)*.07})`;c.fillRect(x,y,32,32);
    c.fillStyle='rgba(255,255,255,.05)';c.fillRect(x+2,y+2,10,3);
  }
},256,256);
floorTex.wrapS=floorTex.wrapT=THREE.RepeatWrapping;
const floorW=XEND-X0;
floorTex.repeat.set(floorW*.55,3.2);
const floorMesh=mesh(new THREE.PlaneGeometry(floorW,7.5),PM(0xffffff,{map:floorTex,roughness:.92}),X0+floorW/2,0,0);
floorMesh.rotation.x=-Math.PI/2;

/* paredes de pedra */
const brickTex=texFromCanvas((c,w,h)=>{
  c.fillStyle='#352a20';c.fillRect(0,0,w,h);
  c.strokeStyle='rgba(0,0,0,.5)';c.lineWidth=3;
  const bw=46,bh=26;
  for(let row=0;row*bh<h+bh;row++){
    const off=row%2?bw/2:0;
    for(let x=-bw+off;x<w+bw;x+=bw){
      c.fillStyle='rgba(255,255,255,.05)';c.fillRect(x+2,row*bh+2,bw-4,4);
      c.strokeRect(x,row*bh,bw,bh);
    }
  }
},256,256);
brickTex.wrapS=brickTex.wrapT=THREE.RepeatWrapping;brickTex.repeat.set(floorW*.5,2.1);
const WALL_Z=3.75;
[-1,1].forEach(side=>{
  const wall=mesh(new THREE.PlaneGeometry(floorW+10,7.2),PM(0xffffff,{map:brickTex}),X0+floorW/2,3.5,WALL_Z*side);
  wall.rotation.y=side>0?Math.PI:0;
});

/* colunas de pedra com tochas de fogo tremeluzentes */
const torchLights=[];
function makeColumnTorch(px,side){
  const x=wx(px),z=WALL_Z*side-side*.4;
  mesh(new THREE.CylinderGeometry(.4,.48,5.8,12),PM(0x4a3e30),x,2.9,z);
  mesh(new THREE.BoxGeometry(1.15,.28,1.15),PM(0x554739),x,5.75,z);
  mesh(new THREE.BoxGeometry(1.15,.28,1.15),PM(0x554739),x,.14,z);
  const bracketZ=z+side*.55;
  mesh(new THREE.CylinderGeometry(.05,.07,.7,6),PM(0x2a1d12),x,3.1,bracketZ);
  const flame=new THREE.PointLight(0xffaa44,1.5,9);
  flame.position.set(x,3.5,bracketZ);scene.add(flame);
  torchLights.push({light:flame,phase:Math.random()*10});
  mesh(new THREE.SphereGeometry(.13,8,8),new THREE.MeshBasicMaterial({color:0xffcc66}),x,3.5,bracketZ);
}
columns.forEach(px=>{makeColumnTorch(px,-1);makeColumnTorch(px,1)});

/* mesas com cadeiras */
function makeTableSet(px){
  const x=wx(px),z=0;
  const wood=PM(0x4a3626),top=PM(0x5a4230);
  [[-1.1,-.6],[-1.1,.6],[1.1,-.6],[1.1,.6]].forEach(l=>mesh(new THREE.CylinderGeometry(.06,.06,1,8),wood,x+l[0],.5,z+l[1]));
  mesh(new THREE.CylinderGeometry(1.3,1.3,.12,16),top,x,1.05,z);
  [-1.8,1.8].forEach(cx=>{
    mesh(new THREE.BoxGeometry(.6,.55,.6),wood,x+cx,.28,z);
    mesh(new THREE.BoxGeometry(.6,.65,.08),wood,x+cx,.6,z+(cx>0?.28:-.28));
  });
  mesh(new THREE.CylinderGeometry(.16,.2,.28,10),PM(0x8a8a92,{metalness:.3}),x-.4,1.25,z);
  mesh(new THREE.TorusGeometry(.18,.06,8,12),PM(0xcaa24a,{metalness:.5,roughness:.3}),x+.5,1.2,z);
}
tableSets.forEach(ts=>makeTableSet(ts.x));

/* quadros na parede */
function makePortrait(px){
  const x=wx(px),side=px%800<400?-1:1,z=WALL_Z*side-side*.1;
  const tex=texFromCanvas((c,w,h)=>{
    const g=c.createLinearGradient(0,0,0,h);
    g.addColorStop(0,'#3a4a6a');g.addColorStop(1,'#1a2438');
    c.fillStyle='#8a6a2a';c.fillRect(0,0,w,h);
    c.fillStyle=g;c.fillRect(w*.08,h*.08,w*.84,h*.84);
    c.fillStyle='#5a4a3a';c.beginPath();c.moveTo(w*.2,h*.7);c.lineTo(w*.45,h*.35);c.lineTo(w*.65,h*.55);c.lineTo(w*.8,h*.3);c.lineTo(w*.85,h*.72);c.closePath();c.fill();
    c.fillStyle='#e8c98a';c.beginPath();c.arc(w*.72,h*.22,w*.08,0,Math.PI*2);c.fill();
  },128,160);
  mesh(new THREE.PlaneGeometry(1.3,1.6),new THREE.MeshBasicMaterial({map:tex}),x,3.9,z).rotation.y=side>0?Math.PI:0;
}
portraits.forEach(p=>makePortrait(p.x));

/* vasos de flores */
function makeVase(px,side){
  const x=wx(px),z=1.7*side;
  mesh(new THREE.CylinderGeometry(.18,.24,.5,10),PM(0x8a5a3a),x,.25,z);
  const colors=[0xdd5577,0xffcf4d,0xffffff,0xaa66dd];
  for(let i=0;i<5;i++){
    const ang=i/5*Math.PI*2;
    mesh(new THREE.SphereGeometry(.13,8,8),PM(colors[i%colors.length],{roughness:.6}),x+Math.cos(ang)*.14,.65+seededRand(px+i)*.12,z+Math.sin(ang)*.14);
  }
  mesh(new THREE.CylinderGeometry(.03,.03,.5,6),PM(0x3a5a2a),x,.5,z);
}
vases.forEach(v=>makeVase(v.x,v.side));

/* plataformas seguradas por correntes, com moedas em cima */
function makeChainPlatform(pf){
  const x=wx(pf.x)+wx(pf.w)/2,y=wy(pf.y);
  mesh(new THREE.BoxGeometry(wx(pf.w),.35,2.2),PM(0x4a3d33),x,y-.18,0);
  [-wx(pf.w)*.3,wx(pf.w)*.3].forEach(dx=>{
    for(let cy=CEIL;cy>y;cy-=.3){
      mesh(new THREE.TorusGeometry(.08,.025,6,8),PM(0x8a8a92,{metalness:.6,roughness:.4}),x+dx,cy,0);
    }
  });
}
platforms.forEach(pf=>{if(pf.chain)makeChainPlatform(pf)});

const coinMeshes=[];
function makeCoinMesh(c){
  const g=mesh(new THREE.CylinderGeometry(.22,.22,.06,16),PM(0xffcf4d,{metalness:.6,roughness:.3,emissive:0x664400,emissiveIntensity:.3}),wx(c.x),wy(c.y),0);
  coinMeshes.push({c,mesh:g});
}
coins.forEach(makeCoinMesh);

/* porta do castelo (meta) */
function makeGoal(px){
  const x=wx(px);
  mesh(new THREE.BoxGeometry(2.4,4,.4),PM(0x3a2a1a),x,2,0);
  mesh(new THREE.BoxGeometry(1.6,3,.2),PM(0x8a1414),x,1.5,.25);
  const crown=mesh(new THREE.ConeGeometry(.3,.4,4),PM(0xcaa24a,{metalness:.5,roughness:.4}),x,3.6,.2);
  crown.rotation.y=Math.PI/4;
}
makeGoal(goal.x);

/* personagem: caçador de recompensas, formas arredondadas (nada quadrado) */
const player3d=new THREE.Group();
const armor=PM(0x17171a,{roughness:.6,metalness:.2});
const silver=PM(0xb9c0cc,{roughness:.35,metalness:.6});
const skin=PM(0xe8b98a,{roughness:.8});
const hairMat=PM(0xc1341a,{roughness:.6});

const legL=mesh(new THREE.CylinderGeometry(.11,.15,.7,10),armor,-.16,.35,0);
const legR=mesh(new THREE.CylinderGeometry(.11,.15,.7,10),armor,.16,.35,0);
player3d.add(legL,legR);
const torso=new THREE.Mesh(new THREE.CylinderGeometry(.32,.38,.85,14),armor);torso.position.y=1.15;player3d.add(torso);
const chest=new THREE.Mesh(new THREE.CylinderGeometry(.34,.36,.4,14,1,false,-.6,1.2),silver);chest.position.set(0,1.32,.03);player3d.add(chest);
const belt=new THREE.Mesh(new THREE.TorusGeometry(.33,.06,8,16),silver);belt.rotation.x=Math.PI/2;belt.position.y=.78;player3d.add(belt);
const shoL=new THREE.Mesh(new THREE.SphereGeometry(.18,10,10),silver);shoL.scale.set(1,.8,1);shoL.position.set(-.38,1.48,0);player3d.add(shoL);
const shoR=new THREE.Mesh(new THREE.SphereGeometry(.18,10,10),silver);shoR.scale.set(1,.8,1);shoR.position.set(.38,1.48,0);player3d.add(shoR);
const armL=new THREE.Mesh(new THREE.CylinderGeometry(.1,.11,.65,10),armor);armL.position.set(-.4,1.1,0);player3d.add(armL);
const armR=new THREE.Mesh(new THREE.CylinderGeometry(.1,.11,.65,10),armor);armR.position.set(.4,1.1,0);player3d.add(armR);
const wristL=new THREE.Mesh(new THREE.CylinderGeometry(.115,.115,.12,10),silver);wristL.position.set(-.4,.82,0);player3d.add(wristL);
const wristR=new THREE.Mesh(new THREE.CylinderGeometry(.115,.115,.12,10),silver);wristR.position.set(.4,.82,0);player3d.add(wristR);
const head=new THREE.Mesh(new THREE.SphereGeometry(.24,16,16),skin);head.position.y=1.82;player3d.add(head);
const eyeL=new THREE.Mesh(new THREE.SphereGeometry(.025,6,6),PM(0x1a1410));eyeL.position.set(-.09,1.83,.21);player3d.add(eyeL);
const eyeR=new THREE.Mesh(new THREE.SphereGeometry(.025,6,6),PM(0x1a1410));eyeR.position.set(.09,1.83,.21);player3d.add(eyeR);
// cabelo vermelho espetado (vários cones ao redor do topo da cabeça)
for(let i=0;i<8;i++){
  const ang=i/8*Math.PI*2;
  const spike=new THREE.Mesh(new THREE.ConeGeometry(.055,.32,6),hairMat);
  spike.position.set(Math.cos(ang)*.14,2.02+seededRand(i)*.06,Math.sin(ang)*.14);
  spike.rotation.set(Math.cos(ang)*.5,0,-Math.sin(ang)*.5);
  player3d.add(spike);
}
scene.add(player3d);

/* ===== loop principal ===== */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.033,(now-last)/1000);last=now;
  update(dt);

  player3d.position.set(wx(P.x),wy(P.y+P.h),0);
  player3d.scale.x=P.dir>=0?1:-1;
  player3d.visible=!(P.inv>0&&Math.floor(t*14)%2===0);

  for(const cm of coinMeshes){
    cm.mesh.visible=!cm.c.got;
    if(!cm.c.got){cm.mesh.rotation.y=t*3;cm.mesh.position.y=wy(cm.c.y)+Math.sin(t*3+cm.c.x)*.06}
  }

  for(const tl of torchLights){
    tl.light.intensity=1.4*(1+Math.sin(t*9+tl.phase)*.18+Math.sin(t*23+tl.phase)*.08+(Math.random()-.5)*.06);
  }

  const camWX=wx(camX);
  camera.position.set(camWX+2.2,3,7.3);
  camera.lookAt(camWX+2.2,1.1,0);

  renderer.render(scene,camera);
}
showMsg('🗡️ Caçador de Recompensas','Toque ou aperte ESPAÇO para começar — pegue as moedas e não caia!');
requestAnimationFrame(frame);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Caçador de Recompensas</title>
<style>
:root{--ink:#fff3d4;--btn:#ffcf4d;--btn-ink:#3a2412}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0;overflow:hidden;background:#0d0906;font-family:"Trebuchet MS",system-ui,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:14px;display:flex;justify-content:space-between;color:#fff;font-weight:800;font-size:clamp(16px,3vw,24px);text-shadow:0 2px 4px rgba(0,0,0,.6);pointer-events:none;z-index:5}
#msg{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);color:#fff;font-weight:800;font-size:clamp(20px,5vw,40px);text-align:center;text-shadow:0 3px 8px rgba(0,0,0,.7);z-index:10}
#msg.off{display:none}
#msg span{display:block;font-size:.5em;font-weight:700;margin-top:10px}
#touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:6}
body.touch #touch{display:block}
.pad{position:absolute;left:14px;bottom:14px;display:grid;grid-template-columns:70px 70px;grid-template-rows:70px;gap:8px}
.pad button,#jbtn{pointer-events:auto;border:3px solid rgba(255,255,255,.7);background:rgba(60,30,90,.5);color:#fff3d4;font-weight:800;font-size:28px;border-radius:18px;touch-action:none}
.pad button:active,#jbtn:active{background:rgba(90,40,130,.85)}
#jbtn{position:fixed;right:18px;bottom:24px;width:100px;height:100px;border-radius:50%;font-size:18px;pointer-events:auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="lv">Fase 1 · Salão Medieval</div>
  <div id="score">🪙 0</div>
  <div id="lives">❤️❤️❤️</div>
</div>
<div id="msg" class="off"><div id="msgTxt"></div><span id="msgSub"></span></div>
<div id="touch">
  <div class="pad">
    <button id="bl">←</button>
    <button id="br">→</button>
  </div>
  <button id="jbtn">PULAR</button>
</div>

<script>
(function(){
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}
addEventListener('resize',resize);resize();
if(matchMedia('(pointer:coarse)').matches)document.body.classList.add('touch');

/* ===== mundo da fase 1: salão medieval de pedra ===== */
const GRAV=1500,JUMP=-620,SPEED=270,GROUND_Y=620;
const LEVEL_END=3100;
// chão de pedra com buracos (precisa pular pelas plataformas de corrente)
const platforms=[
  {x:0,y:GROUND_Y,w:420,h:200,ground:true},
  {x:560,y:GROUND_Y-120,w:150,h:24,chain:true,anchorY:40},
  {x:860,y:GROUND_Y,w:260,h:200,ground:true},
  {x:1260,y:GROUND_Y-90,w:140,h:24,chain:true,anchorY:40},
  {x:1520,y:GROUND_Y-170,w:140,h:24,chain:true,anchorY:40},
  {x:1780,y:GROUND_Y-90,w:140,h:24,chain:true,anchorY:40},
  {x:2040,y:GROUND_Y,w:220,h:200,ground:true},
  {x:2380,y:GROUND_Y-110,w:150,h:24,chain:true,anchorY:40},
  {x:2650,y:GROUND_Y-200,w:150,h:24,chain:true,anchorY:40},
  {x:2920,y:GROUND_Y,w:LEVEL_END+400-2920,h:200,ground:true},
];
// colunas de pedra com tochas de fogo (decoração)
const columns=[120,480,1000,1400,1700,2000,2320,2700,3050].map(x=>({x}));
// moedas em cima das plataformas
const coins=[];
for(const pf of platforms){
  if(pf.chain){
    coins.push({x:pf.x+pf.w*.3,y:pf.y-34,got:false});
    coins.push({x:pf.x+pf.w*.7,y:pf.y-34,got:false});
  }
}
[960,1010,2080,2130,2180].forEach(x=>coins.push({x,y:GROUND_Y-40,got:false}));
const goal={x:LEVEL_END,y:GROUND_Y-150,w:70,h:150};

/* ===== estado ===== */
let state='title',lives=3,score=0,camX=0,t=0,keys={},touchL=0,touchR=0,jumpBuf=0;
let P={x:60,y:GROUND_Y-70,vx:0,vy:0,w:30,h:50,onGround:false,coy:0,inv:0,dir:1};
function resetPlayer(){P.x=60;P.y=GROUND_Y-70;P.vx=0;P.vy=0;P.onGround=false;P.coy=0;P.inv=1;camX=0}
function setLives(){$('lives').textContent='❤️'.repeat(Math.max(0,lives))+'🖤'.repeat(Math.max(0,3-lives))}
function setScore(){$('score').textContent='🪙 '+score}
function showMsg(txt,sub){$('msgTxt').textContent=txt;$('msgSub').textContent=sub||'';$('msg').classList.remove('off')}
function hideMsg(){$('msg').classList.add('off')}

function start(){
  lives=3;score=0;setLives();setScore();resetPlayer();coins.forEach(c=>c.got=false);state='playing';hideMsg();
}
showMsg('🗡️ Caçador de Recompensas','Toque ou aperte ESPAÇO para começar — pegue as moedas e não caia!');
addEventListener('keydown',e=>{
  if((state==='title'||state==='over'||state==='win')&&(e.code==='Space'||e.code==='Enter')){start();return}
  keys[e.code]=true;
  if(!e.repeat&&(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'))jumpBuf=.12;
});
addEventListener('keyup',e=>{keys[e.code]=false});
cv.addEventListener('pointerdown',()=>{
  if(state==='title'||state==='over'||state==='win')start();
});
$('bl').addEventListener('pointerdown',e=>{e.preventDefault();touchL=1});
$('br').addEventListener('pointerdown',e=>{e.preventDefault();touchR=1});
['pointerup','pointercancel','pointerleave'].forEach(ev=>{
  $('bl').addEventListener(ev,()=>touchL=0);
  $('br').addEventListener(ev,()=>touchR=0);
});
$('jbtn').addEventListener('pointerdown',e=>{e.preventDefault();jumpBuf=.12});

function rectsOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function update(dt){
  t+=dt;
  if(state!=='playing')return;
  if(jumpBuf>0)jumpBuf-=dt;
  if(P.inv>0)P.inv-=dt;
  const left=keys.ArrowLeft||keys.KeyA||touchL,right=keys.ArrowRight||keys.KeyD||touchR;
  const ax=(right?1:0)-(left?1:0);
  if(ax)P.dir=ax;
  const want=ax*SPEED;
  const acc=P.onGround?2600:1400;
  if(P.vx<want)P.vx=Math.min(want,P.vx+acc*dt);else if(P.vx>want)P.vx=Math.max(want,P.vx-acc*dt);
  P.x+=P.vx*dt;
  P.x=Math.max(P.x,10);
  if(P.onGround)P.coy=.1;else P.coy-=dt;
  if(jumpBuf>0&&P.coy>0){P.vy=JUMP;P.onGround=false;P.coy=0;jumpBuf=0}
  P.vy+=GRAV*dt;
  const oy=P.y;
  P.y+=P.vy*dt;
  P.onGround=false;
  for(const pf of platforms){
    if(P.x+P.w>pf.x&&P.x<pf.x+pf.w){
      if(P.vy>=0&&oy+P.h<=pf.y+10&&P.y+P.h>=pf.y){
        P.y=pf.y-P.h;P.vy=0;P.onGround=true;
      }
    }
  }
  // moedas
  const pb={x:P.x,y:P.y,w:P.w,h:P.h};
  for(const c of coins){
    if(c.got)continue;
    const cb={x:c.x-12,y:c.y-12,w:24,h:24};
    if(rectsOverlap(pb,cb)){c.got=true;score++;setScore()}
  }
  // caiu no buraco
  if(P.y>H+250){
    lives--;setLives();
    if(lives<=0){state='over';showMsg('💀 Você caiu no vazio','Toque ou aperte ESPAÇO para tentar de novo')}
    else{resetPlayer();P.inv=1.2}
  }
  // chegou na meta
  if(rectsOverlap(pb,goal)){
    state='win';showMsg('👑 Fase 1 completa!','Moedas: '+score+' — Toque ou aperte ESPAÇO para jogar de novo');
  }
  const targetCam=Math.max(0,Math.min(LEVEL_END-W+90,P.x-W*.4));
  camX+=(targetCam-camX)*Math.min(1,dt*4);
}

/* ===== desenho ===== */
function drawBackground(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1c1410');g.addColorStop(1,'#362519');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=2;
  const bw=82,bh=56;
  for(let row=0;row*bh<H*.68+bh;row++){
    const off=row%2?bw/2:0;
    for(let x=-bw+((camX*.3)%bw)*-1+off;x<W+bw;x+=bw){
      ctx.fillStyle='rgba(255,255,255,.04)';ctx.fillRect(x+2,row*bh+2,bw-4,4);
      ctx.strokeRect(x,row*bh,bw,bh);
    }
  }
}
function drawColumn(x){
  const bx=x-camX;if(bx<-60||bx>W+60)return;
  const top=H*.05,w=56,h=H*.72;
  const g=ctx.createLinearGradient(bx-w/2,0,bx+w/2,0);
  g.addColorStop(0,'#2a2018');g.addColorStop(.5,'#5a4a38');g.addColorStop(1,'#20180f');
  ctx.fillStyle=g;ctx.fillRect(bx-w/2,top,w,h);
  ctx.fillStyle='#4a3e30';ctx.fillRect(bx-w/2-10,top-16,w+20,18);
  ctx.fillStyle='#4a3e30';ctx.fillRect(bx-w/2-10,top+h,w+20,18);
  // tocha presa na coluna
  const ty=top+h*.28;
  ctx.fillStyle='#2a1d12';ctx.fillRect(bx-5,ty,10,34);
  const flick=Math.sin(t*9+x)*.15+Math.sin(t*23+x)*.08;
  const r=22+flick*10;
  const rg=ctx.createRadialGradient(bx,ty-14,2,bx,ty-14,r);
  rg.addColorStop(0,'rgba(255,220,140,.95)');rg.addColorStop(.5,'rgba(255,140,40,.55)');rg.addColorStop(1,'rgba(255,90,20,0)');
  ctx.fillStyle=rg;ctx.beginPath();ctx.arc(bx,ty-14,r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffcf4d';
  ctx.beginPath();ctx.moveTo(bx,ty-30-flick*4);ctx.quadraticCurveTo(bx+9,ty-16,bx,ty-4);ctx.quadraticCurveTo(bx-9,ty-16,bx,ty-30-flick*4);ctx.fill();
  ctx.fillStyle='#ff6a1a';
  ctx.beginPath();ctx.moveTo(bx,ty-22-flick*3);ctx.quadraticCurveTo(bx+5,ty-14,bx,ty-6);ctx.quadraticCurveTo(bx-5,ty-14,bx,ty-22-flick*3);ctx.fill();
}
function drawChain(pf){
  const bx=pf.x-camX,cx1=bx+pf.w*.22,cx2=bx+pf.w*.78,topY=pf.anchorY;
  ctx.strokeStyle='#8a8a92';ctx.lineWidth=5;
  [cx1,cx2].forEach(cx=>{
    for(let y=topY;y<pf.y;y+=18){
      ctx.beginPath();ctx.ellipse(cx,y,6,9,0,0,Math.PI*2);ctx.stroke();
    }
  });
}
function drawPlatform(pf){
  const bx=pf.x-camX;
  if(pf.chain)drawChain(pf);
  ctx.fillStyle='#4a3d33';
  ctx.fillRect(bx,pf.y,pf.w,pf.h);
  ctx.fillStyle='#6b5a4a';
  ctx.fillRect(bx,pf.y,pf.w,6);
  ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=2;
  for(let x=0;x<pf.w;x+=40)ctx.strokeRect(bx+x,pf.y,Math.min(40,pf.w-x),pf.h);
}
function drawCoin(c){
  if(c.got)return;
  const x=c.x-camX;if(x<-40||x>W+40)return;
  const bob=Math.sin(t*3+c.x)*4;
  const sq=Math.abs(Math.sin(t*2+c.x*.3))*10+6;
  ctx.fillStyle='#ffcf4d';
  ctx.beginPath();ctx.ellipse(x,c.y+bob,sq,12,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#e8a92a';
  ctx.beginPath();ctx.ellipse(x,c.y+bob,sq*.55,6,0,0,Math.PI*2);ctx.fill();
}
function drawGoal(){
  const x=goal.x-camX;
  ctx.fillStyle='#3a2a1a';ctx.fillRect(x-8,goal.y-10,goal.w+16,goal.h+20);
  ctx.fillStyle='#caa24a';
  ctx.beginPath();ctx.moveTo(x+goal.w/2-14,goal.y+10);ctx.lineTo(x+goal.w/2-14,goal.y+2);ctx.lineTo(x+goal.w/2-7,goal.y+10);ctx.lineTo(x+goal.w/2,goal.y);ctx.lineTo(x+goal.w/2+7,goal.y+10);ctx.lineTo(x+goal.w/2+14,goal.y+2);ctx.lineTo(x+goal.w/2+14,goal.y+10);ctx.closePath();ctx.fill();
  ctx.fillStyle='#8a1414';ctx.fillRect(x+8,goal.y+16,goal.w-16,goal.h-16);
  ctx.strokeStyle='#caa24a';ctx.lineWidth=3;ctx.strokeRect(x+8,goal.y+16,goal.w-16,goal.h-16);
}
function drawPlayer(){
  if(P.inv>0&&Math.floor(t*14)%2===0)return;
  const x=P.x-camX,y=P.y,flip=P.dir<0;
  ctx.save();
  if(flip){ctx.translate(x+P.w,y);ctx.scale(-1,1);}else{ctx.translate(x,y);}
  // pernas (bota preta)
  ctx.fillStyle='#161616';
  ctx.fillRect(2,34,10,16);ctx.fillRect(18,34,10,16);
  // corpo: roupa preta de caçador de recompensas
  ctx.fillStyle='#1a1a1c';
  ctx.fillRect(3,14,24,24);
  // detalhes prateados de armadura no peito
  ctx.fillStyle='#c7ccd6';
  ctx.fillRect(6,17,18,5);
  ctx.fillRect(6,25,7,5);ctx.fillRect(17,25,7,5);
  // ombreiras prateadas
  ctx.fillStyle='#9aa0ac';
  ctx.fillRect(0,13,8,9);ctx.fillRect(22,13,8,9);
  // cinto
  ctx.fillStyle='#c7ccd6';ctx.fillRect(3,33,24,4);
  // braços
  ctx.fillStyle='#1a1a1c';ctx.fillRect(-3,17,6,18);ctx.fillRect(27,17,6,18);
  // cabeça (pele)
  ctx.fillStyle='#e8b98a';ctx.fillRect(6,0,18,15);
  // cabelo vermelho espetado
  ctx.fillStyle='#c1341a';
  ctx.beginPath();
  ctx.moveTo(4,3);ctx.lineTo(8,-8);ctx.lineTo(10,2);
  ctx.lineTo(13,-11);ctx.lineTo(15,1);
  ctx.lineTo(18,-9);ctx.lineTo(20,2);
  ctx.lineTo(24,-6);ctx.lineTo(26,4);
  ctx.closePath();ctx.fill();
  // olhos
  ctx.fillStyle='#1a1410';ctx.fillRect(17,6,4,4);
  ctx.restore();
}
function draw(){
  drawBackground();
  for(const c of columns)drawColumn(c.x);
  for(const pf of platforms)drawPlatform(pf);
  for(const c of coins)drawCoin(c);
  drawGoal();
  drawPlayer();
}

let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.033,(now-last)/1000);last=now;
  update(dt);draw();
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
